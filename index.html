<title>VOCAflow  - Learn words the fun way ✨</title>

<style>
/* ============================================= */
/* SECTION: CSS VARIABLES & RESET                */
/* ============================================= */
:root {
--primary: #8B5CF6;
--primary-dark: #7C3AED;
--secondary: #6D28D9;
--accent: #C4B5FD;
--success: #10B981;
--success-light: rgba(16, 185, 129, 0.15);
--warning: #F59E0B;
--warning-light: rgba(245, 158, 11, 0.15);
--danger: #EF4444;
--danger-light: rgba(239, 68, 68, 0.15);
--info: #8B5CF6;
--bg-start: #FFFFFF;
--bg-end: #F4F4F5;
--text: #18181B;
--text-light: #3F3F46;
--text-muted: #71717A;
--glass-bg: rgba(255, 255, 255, 0.75);
--glass-bg-strong: rgba(255, 255, 255, 0.92);
--glass-border: rgba(0, 0, 0, 0.08);
--glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
--glass-shadow-deep: 0 20px 60px rgba(0, 0, 0, 0.12);
--radius: 24px;
--radius-sm: 14px;
--radius-lg: 28px;
--card-bg: #FFFFFF;
--card-border: rgba(0, 0, 0, 0.08);
--input-bg: rgba(255, 255, 255, 0.95);
--input-border: rgba(139, 92, 246, 0.25);
--shadow-color: 0, 0, 0;
--nav-height: 72px;
--safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
--bg-start: #18181B;
--bg-end: #0C0A09;
--text: #FAFAFA;
--text-light: #D4D4D8;
--text-muted: #A1A1AA;
--glass-bg: rgba(24, 24, 27, 0.75);
--glass-bg-strong: rgba(24, 24, 27, 0.92);
--glass-border: rgba(255, 255, 255, 0.10);
--glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.40);
--glass-shadow-deep: 0 20px 60px rgba(0, 0, 0, 0.50);
--card-bg: #27272A;
--card-border: rgba(255, 255, 255, 0.08);
--input-bg: rgba(39, 39, 42, 0.95);
--input-border: rgba(255, 255, 255, 0.12);
--shadow-color: 255, 255, 255;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
input, textarea, select, button { font-family: inherit; }
html, body {
font-family: 'Tajawal', 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
color: var(--text);
min-height: 100vh;
overflow-x: hidden;
line-height: 1.6;
letter-spacing: 0.01em;
transition: background 0.4s ease, color 0.3s ease;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
body { background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%); background-attachment: fixed; }
body::before {
content: '';
position: fixed; inset: 0;
background-image: radial-gradient(circle at 20% 30%, rgba(139,92,246,0.06) 0%, transparent 40%),
radial-gradient(circle at 80% 70%, rgba(139,92,246,0.06) 0%, transparent 40%);
pointer-events: none; z-index: 0;
}
#root { position: relative; z-index: 1; min-height: 100vh; }
.app {
max-width: 780px; margin: 0 auto; padding: 20px;
padding-bottom: calc(110px + var(--safe-bottom));
min-height: 100vh; font-size: clamp(14px, 4vw, 16px);
}
.site-logo h1 { font-size: clamp(22px, 6vw, 32px); }
.site-logo .tagline { font-size: clamp(11px, 3vw, 13px); }
.game-title { font-size: clamp(15px, 4vw, 17px); }
.game-subtitle { font-size: clamp(11px, 3vw, 12px); }
.profile-greeting { font-size: clamp(18px, 5vw, 22px); }
.profile-note { font-size: clamp(12px, 3.2vw, 13px); }
.games-header-title { font-size: clamp(20px, 5.5vw, 26px); }
.games-header-desc { font-size: clamp(12px, 3.2vw, 13px); }
.section-title { font-size: clamp(16px, 4.5vw, 20px); }
.glass {
background: var(--glass-bg);
backdrop-filter: blur(25px) saturate(180%);
-webkit-backdrop-filter: blur(25px) saturate(180%);
border: 1px solid var(--glass-border);
box-shadow: var(--glass-shadow);
border-radius: var(--radius);
transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.glass:hover { box-shadow: var(--glass-shadow-deep); }
.btn {
border: none; border-radius: var(--radius-sm);
padding: 13px 22px; font-size: clamp(14px, 3.8vw, 15px);
font-weight: 700; cursor: pointer;
transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
display: inline-flex; align-items: center; justify-content: center;
gap: 8px; min-height: 44px; min-width: 44px;
letter-spacing: 0.02em; position: relative; overflow: hidden;
touch-action: manipulation;
}
.btn::before {
content: ''; position: absolute; top: 50%; left: 50%;
width: 0; height: 0; border-radius: 50%;
background: rgba(255,255,255,0.3);
transform: translate(-50%, -50%);
transition: width 0.6s, height 0.6s;
}
.btn:active::before { width: 300px; height: 300px; }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(var(--shadow-color), 0.15); }
.btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 6px 20px rgba(139,92,246,0.4); }
.btn-success { background: linear-gradient(135deg, #10B981, #059669); color: white; box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
.btn-danger { background: linear-gradient(135deg, #EF4444, #DC2626); color: white; box-shadow: 0 6px 20px rgba(239,68,68,0.4); }
.btn-secondary { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); color: var(--text); border: 1px solid var(--glass-border); }
[data-theme="dark"] .btn-secondary { background: rgba(39,39,42,0.85); border-color: rgba(255,255,255,0.12); }
.btn-block { width: 100%; }
.btn-lg { padding: 16px 28px; font-size: clamp(15px, 4vw, 17px); min-height: 56px; }
.icon-btn {
background: rgba(255,255,255,0.3); backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,0.3); font-size: 18px;
cursor: pointer; padding: 10px; border-radius: 12px;
transition: all 0.2s; min-width: 44px; min-height: 44px;
display: flex; align-items: center; justify-content: center; color: var(--text);
touch-action: manipulation;
}
.icon-btn:hover { background: rgba(139,92,246,0.15); transform: scale(1.08); color: var(--primary); }
.icon-btn.danger:hover { background: var(--danger-light); color: var(--danger); }
[data-theme="dark"] .icon-btn { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.08); }
[data-theme="dark"] .icon-btn:hover { background: rgba(139,92,246,0.2); }
.muted { color: var(--text-light); font-size: 13px; font-weight: 500; }
.flex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.site-logo { cursor: pointer; }
.site-logo h1 {
font-weight: 900;
background: linear-gradient(135deg, #8B5CF6 0%, #18181B 100%);
-webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
display: flex; align-items: center; gap: 10px;
letter-spacing: -0.02em;
}
[data-theme="dark"] .site-logo h1 { background: linear-gradient(135deg, #C4B5FD 0%, #FFFFFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.site-logo .tagline { color: var(--text-light); font-weight: 500; margin-top: 2px; }
.profile-card {
background: var(--glass-bg-strong);
backdrop-filter: blur(25px) saturate(180%);
border: 1px solid var(--glass-border);
border-radius: var(--radius-lg); padding: 26px;
box-shadow: var(--glass-shadow-deep);
position: relative; overflow: hidden;
}
.profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; position: relative; z-index: 2; }
.avatar {
width: clamp(80px, 20vw, 120px); height: clamp(80px, 20vw, 120px);
border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary));
color: white; display: flex; align-items: center; justify-content: center;
font-size: clamp(32px, 8vw, 44px); font-weight: 900; flex-shrink: 0;
box-shadow: 0 0 0 4px rgba(139,92,246,0.3), 0 12px 32px rgba(139,92,246,0.4);
position: relative; overflow: hidden; cursor: pointer;
transition: all 0.3s; border: 3px solid rgba(255,255,255,0.7);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-info { flex: 1; min-width: 0; }
.profile-greeting { font-weight: 800; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
.profile-note { color: var(--text-light); line-height: 1.5; font-weight: 500; }
.profile-stats {
display: flex; gap: 20px; flex-wrap: wrap; padding-top: 18px;
border-top: 1px solid rgba(139,92,246,0.2); position: relative; z-index: 2;
}
.stat-item { display: flex; align-items: center; gap: 10px; font-size: clamp(12px, 3.5vw, 14px); color: var(--text-light); font-weight: 600; }
.stat-item .value { color: var(--text); font-weight: 800; font-size: clamp(15px, 4vw, 17px); }
.stat-item .stat-label { font-size: clamp(11px, 3vw, 12px); color: var(--text-light); font-weight: 600; }
[dir="rtl"] .profile-actions { right: auto; left: 20px; }
.flame-container {
width: clamp(48px, 12vw, 58px); height: clamp(58px, 14vw, 70px);
position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.flame-svg { width: 100%; height: 100%; animation: flameFlicker 2.2s ease-in-out infinite; transform-origin: bottom center; }
@keyframes flameFlicker {
0%, 100% { transform: scaleY(1) scaleX(1); }
15% { transform: scaleY(0.94) scaleX(1.03); }
30% { transform: scaleY(1.04) scaleX(0.97); }
45% { transform: scaleY(0.96) scaleX(1.02); }
60% { transform: scaleY(1.03) scaleX(0.96); }
75% { transform: scaleY(0.95) scaleX(1.04); }
90% { transform: scaleY(1.02) scaleX(0.98); }
}
.flame-level {
position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
font-weight: 900; font-size: clamp(13px, 3.5vw, 16px);
color: white; text-shadow: 0 1px 4px rgba(0,0,0,0.4);
z-index: 5; pointer-events: none;
}
.flame-red .flame-svg { filter: drop-shadow(0 3px 12px rgba(239,68,68,0.7)); }
.flame-white .flame-svg { filter: drop-shadow(0 3px 12px rgba(255,255,255,0.7)); }
.flame-blue .flame-svg { filter: drop-shadow(0 3px 12px rgba(59,130,246,0.7)); }
.flame-purple .flame-svg { filter: drop-shadow(0 3px 12px rgba(139,92,246,0.7)); }
.flame-rainbow .flame-svg { animation: flameFlicker 2.2s ease-in-out infinite, rainbowGlow 12s linear infinite; }
@keyframes rainbowGlow {
0%, 100% { filter: drop-shadow(0 3px 12px rgba(239,68,68,0.8)); }
25% { filter: drop-shadow(0 3px 12px rgba(255,255,255,0.8)); }
50% { filter: drop-shadow(0 3px 12px rgba(59,130,246,0.8)); }
75% { filter: drop-shadow(0 3px 12px rgba(139,92,246,0.8)); }
}
.dropdown-wrapper { position: relative; margin-bottom: 18px; }
.dropdown-trigger {
width: 100%; padding: 16px 20px;
background: var(--glass-bg-strong); backdrop-filter: blur(20px);
border: 1px solid var(--input-border); border-radius: var(--radius);
font-size: clamp(14px, 3.8vw, 16px); font-weight: 700; cursor: pointer;
display: flex; justify-content: space-between; align-items: center;
min-height: 54px; color: var(--text); transition: all 0.3s;
touch-action: manipulation;
}
.dropdown-trigger:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(139,92,246,0.2); }
.dropdown-trigger .arrow { transition: transform 0.3s; font-size: 14px; color: var(--primary); display: flex; align-items: center; }
.dropdown-trigger .arrow.open { transform: rotate(180deg); }
.dropdown-menu {
position: absolute; top: calc(100% + 10px); left: 0; right: 0;
background: var(--glass-bg-strong); backdrop-filter: blur(30px);
border: 1px solid var(--glass-border); border-radius: var(--radius);
box-shadow: 0 24px 64px rgba(var(--shadow-color), 0.2); z-index: 50;
max-height: 420px; overflow-y: auto; padding: 10px;
animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
.dropdown-search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--input-border); background: var(--input-bg); margin-bottom: 10px; font-size: 14px; color: var(--text); }
.dropdown-search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
.dropdown-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
.dropdown-item:hover { background: rgba(139,92,246,0.08); }
.dropdown-item-main { flex: 1; min-width: 0; }
.dropdown-item-name { font-weight: 700; font-size: 14px; color: var(--text); }
.dropdown-item-meta { font-size: 12px; color: var(--text-light); margin-top: 3px; }
.dropdown-item-actions { display: flex; gap: 6px; }
.dropdown-item.primary { background: linear-gradient(135deg, rgba(139,92,246,0.12), rgba(109,40,217,0.12)); color: var(--primary); font-weight: 700; justify-content: center; margin-top: 10px; border: 1px dashed rgba(139,92,246,0.4); }
.sanctuary {
background: linear-gradient(135deg, #FAFAFA 0%, #EDE9FE 40%, #DDD6FE 100%);
border: 2px solid rgba(139,92,246,0.25); border-radius: var(--radius-lg);
padding: 22px; margin: 20px 0; position: relative; overflow: hidden;
box-shadow: 0 12px 40px rgba(139,92,246,0.15);
}
[data-theme="dark"] .sanctuary { background: linear-gradient(135deg, #18181B 0%, #27272A 40%, #3F3F46 100%); border-color: rgba(139,92,246,0.4); }
.sanctuary-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; position: relative; z-index: 2; }
.sanctuary-info { display: flex; align-items: center; gap: 14px; }
.sanctuary-icon { font-size: clamp(32px, 8vw, 44px); animation: floatCastle 4s ease-in-out infinite; }
@keyframes floatCastle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.sanctuary-title { font-size: clamp(16px, 4.5vw, 19px); font-weight: 900; color: #18181B; }
[data-theme="dark"] .sanctuary-title { color: #FAFAFA; }
.sanctuary-subtitle { font-size: clamp(11px, 3.2vw, 13px); color: #3F3F46; font-weight: 600; }
[data-theme="dark"] .sanctuary-subtitle { color: #D4D4D8; }
.sanctuary-count { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.75); padding: 4px 14px; border-radius: 20px; font-size: clamp(10px, 3vw, 12px); color: #18181B; font-weight: 800; margin-top: 6px; }
[data-theme="dark"] .sanctuary-count { background: rgba(24,24,27,0.75); color: #FAFAFA; }
.btn-gold { background: linear-gradient(135deg, #8B5CF6, #C4B5FD); color: white; box-shadow: 0 6px 20px rgba(139,92,246,0.5); font-weight: 800; }
[data-theme="dark"] .btn-gold { color: white; }
.games-header-wrap { margin: 28px 0 6px; }
.games-header-title {
font-weight: 900;
background: linear-gradient(135deg, #8B5CF6 0%, #18181B 50%, #C4B5FD 100%);
-webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em;
}
[data-theme="dark"] .games-header-title { background: linear-gradient(135deg, #C4B5FD 0%, #FFFFFF 50%, #8B5CF6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.games-header-desc { color: var(--text-light); font-weight: 600; margin-top: 4px; padding-left: 44px; opacity: 0.85; }
.games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(10px, 2vw, 14px); margin-bottom: 20px; }
.game-card {
background: var(--glass-bg-strong); backdrop-filter: blur(20px);
border: 1px solid var(--glass-border);
padding: clamp(14px, 3.5vw, 18px) clamp(10px, 2.5vw, 12px);
border-radius: var(--radius); cursor: pointer;
transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
text-align: center; position: relative; overflow: hidden; min-height: 44px;
touch-action: manipulation;
}
.game-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(139,92,246,0.25); border-color: var(--primary); }
.game-card:active { transform: scale(0.97); }
.game-icon-wrap { width: clamp(44px, 11vw, 54px); height: clamp(44px, 11vw, 54px); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; border-radius: 16px; transition: transform 0.3s; }
.game-card:hover .game-icon-wrap { transform: scale(1.1) rotate(-3deg); }
.game-icon-wrap svg { width: 100%; height: 100%; }
.game-name { font-size: clamp(11px, 3vw, 13px); font-weight: 800; color: var(--text); }
.flashcard-game { max-width: 660px; margin: 0 auto; }
.dual-card-container {
display: flex;
flex-direction: row;
gap: 20px;
width: 92%;
max-width: 600px;
margin: 28px auto;
min-height: 340px;
-webkit-user-select: none;
user-select: none;
-webkit-touch-callout: none;
justify-content: center;
align-items: stretch;
}
@media (max-width: 600px) {
.dual-card-container {
flex-direction: column;
align-items: center;
}
}
.dual-card {
flex: 1;
min-width: 200px;
max-width: 280px;
width: 100%;
min-height: 340px;
position: relative;
border-radius: 28px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: clamp(24px, 6vw, 40px);
box-shadow: 0 25px 70px rgba(139,92,246,0.25), 0 10px 30px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.15);
overflow: hidden;
cursor: pointer;
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.dual-card::before {
content: '';
position: absolute; inset: 0;
background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.12) 0%, transparent 50%),
radial-gradient(circle at 80% 70%, rgba(255,255,255,0.08) 0%, transparent 40%);
pointer-events: none;
}
.dual-card-french,
.dual-card-arabic {
background: rgba(24, 24, 27, 0.75);
backdrop-filter: blur(20px) saturate(180%);
-webkit-backdrop-filter: blur(20px) saturate(180%);
color: #FAFAFA;
border: 1px solid rgba(255, 255, 255, 0.15);
}
.dual-card-french {
background: rgba(24, 24, 27, 0.75);
color: #FAFAFA;
}
.dual-card-arabic {
background: rgba(24, 24, 27, 0.75);
color: #FAFAFA;
animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
[data-theme="dark"] .dual-card-french,
[data-theme="dark"] .dual-card-arabic {
background: rgba(24, 24, 27, 0.85);
border: 1px solid rgba(139,92,246,0.4);
}
.single-card-mode {
width: 100%;
max-width: 420px;
justify-content: center;
gap: 0;
}
.single-card-mode .dual-card {
max-width: 100%;
width: 100%;
min-height: 360px;
animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.dual-card:active {
transform: scale(0.97);
}
.card-word, .card-translation {
font-size: clamp(32px, 8vw, 52px);
font-weight: 900; text-align: center; word-break: break-word;
z-index: 2; text-shadow: 0 4px 16px rgba(0,0,0,0.15);
line-height: 1.2; padding: 0 12px;
color: #FFFFFF;
}
.dual-card-arabic .card-word, .dual-card-arabic .card-translation { text-shadow: 0 4px 16px rgba(0,0,0,0.35); }
.card-lang-label {
font-size: 13px; opacity: 0.92; margin-bottom: 16px; font-weight: 700;
padding: 6px 16px; background: rgba(139,92,246,0.25);
backdrop-filter: blur(10px); border-radius: 20px;
letter-spacing: 0.05em; z-index: 2;
color: white;
}
.dual-card-arabic .card-lang-label { background: rgba(255,255,255,0.2); color: white; }
.card-hint {
font-size: 12px; opacity: 0.75; margin-top: 24px; font-weight: 600;
letter-spacing: 0.08em; text-transform: uppercase; z-index: 2;
animation: pulse 2s ease-in-out infinite;
color: white;
}
@keyframes pulse {
0%, 100% { opacity: 0.75; transform: translateY(0); }
50% { opacity: 0.4; transform: translateY(-2px); }
}
.card-top-actions {
position: absolute; top: 16px; left: 16px; right: 16px;
display: flex; justify-content: space-between; align-items: center; z-index: 10;
direction: ltr;
pointer-events: none;
}
.card-top-actions > * { pointer-events: auto; }
.card-chip {
background: rgba(139,92,246,0.35); color: white; border-radius: 999px;
padding: 6px 16px; font-size: 12px; font-weight: 800;
backdrop-filter: blur(10px);
}

cursor: pointer;
padding: 10px 8px 14px !important;

justify-content: space-between !important;

    const uWords = clean(userText).split(' ');
    const cWords = clean(correctText).split(' ');
    const uOriginal = userText.trim().split(/\s+/);
    const cOriginal = correctText.trim().split(/\s+/);

    const m = uWords.length, n = cWords.length;
    const dp = Array(m + 1).fill(0).map(() => Array(n + 1).fill(0));
    for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
            dp[i][j] = uWords[i-1] === cWords[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
        }
    }

    const ops = [];
    let i = m, j = n;
    while (i > 0 && j > 0) {
        if (uWords[i-1] === cWords[j-1]) {
            ops.push({ type: 'match', u: i-1, c: j-1 });
            i--; j--;
        } else if (dp[i-1][j] >= dp[i][j-1]) {
            ops.push({ type: 'extra', u: i-1 });
            i--;
        } else {
            ops.push({ type: 'missing', c: j-1 });
            j--;
        }
    }
    while (i > 0) { ops.push({ type: 'extra', u: i-1 }); i--; }
    while (j > 0) { ops.push({ type: 'missing', c: j-1 }); j--; }
    ops.reverse();

    const finalUser = [];
    const finalCorrect = [];
    
    for (let k = 0; k < ops.length; k++) {
        if (ops[k].type === 'extra' && ops[k+1] && ops[k+1].type === 'missing') {
            finalUser.push({ text: uOriginal[ops[k].u], status: 'wrong' });
            finalCorrect.push({ text: cOriginal[ops[k+1].c], status: 'wrong' });
            k++;
        } else if (ops[k].type === 'missing' && ops[k+1] && ops[k+1].type === 'extra') {
            finalCorrect.push({ text: cOriginal[ops[k].c], status: 'wrong' });
            finalUser.push({ text: uOriginal[ops[k+1].u], status: 'wrong' });
            k++;
        } else if (ops[k].type === 'match') {
            finalUser.push({ text: uOriginal[ops[k].u], status: 'correct' });
            finalCorrect.push({ text: cOriginal[ops[k].c], status: 'correct' });
        } else if (ops[k].type === 'extra') {
            finalUser.push({ text: uOriginal[ops[k].u], status: 'extra' });
        } else if (ops[k].type === 'missing') {
            finalCorrect.push({ text: cOriginal[ops[k].c], status: 'missing' });
        }
    }

    const correctCount = finalUser.filter(w => w.status === 'correct').length;
    const totalWords = cWords.length;
    
    return { userTokens: finalUser, correctTokens: finalCorrect, correctCount, totalWords };
}

function FlameIconEnhanced({ level = 0 }) {
const [rainbowPhase, setRainbowPhase] = useState(0);
useEffect(() => {
if (level >= 60) {
const interval = setInterval(() => setRainbowPhase(p => (p + 1) % 4), 3000);
return () => clearInterval(interval);
}
}, [level]);
let colorClass = 'flame-red';
let gradientId = 'flameGradRed';
let colors = ['#FEE2E2', '#F87171', '#EF4444'];
if (level >= 60) {
colorClass = 'flame-rainbow';
gradientId = 'flameGradRainbow';
const phases = [
['#FEE2E2', '#F87171', '#EF4444'],
['#FFFFFF', '#E5E7EB', '#9CA3AF'],
['#DBEAFE', '#3B82F6', '#1D4ED8'],
['#EDE9FE', '#8B5CF6', '#6D28D9']
];
colors = phases[rainbowPhase];
} else if (level >= 45) {
colorClass = 'flame-purple';
gradientId = 'flameGradPurple';
colors = ['#EDE9FE', '#8B5CF6', '#6D28D9'];
} else if (level >= 30) {
colorClass = 'flame-blue';
gradientId = 'flameGradBlue';
colors = ['#DBEAFE', '#3B82F6', '#1D4ED8'];
} else if (level >= 15) {
colorClass = 'flame-white';
gradientId = 'flameGradWhite';
colors = ['#FFFFFF', '#E5E7EB', '#9CA3AF'];
} else {
colorClass = 'flame-red';
gradientId = 'flameGradRed';
colors = ['#FEE2E2', '#F87171', '#EF4444'];
}
return (
<div className={`flame-container ${colorClass}`}>
<svg viewBox="0 0 100 120" className="flame-svg" role="img" aria-label={`Level ${level}`}>
<defs>
<radialGradient id={gradientId} cx="50%" cy="35%" r="65%">
<stop offset="0%" style={{ stopColor: colors[0], transition: 'stop-color 3s ease-in-out' }} />
<stop offset="45%" style={{ stopColor: colors[1], transition: 'stop-color 3s ease-in-out' }} />
<stop offset="100%" style={{ stopColor: colors[2], transition: 'stop-color 3s ease-in-out' }} />
</radialGradient>
</defs>
<path d="M50 4 C66 22 88 40 82 72 C78 100 60 114 50 114 C40 114 22 100 18 72 C12 40 34 22 50 4 Z" fill={`url(#${gradientId})`} opacity="0.96"/>
<path d="M50 24 C60 38 74 50 68 72 C64 90 55 100 50 100 C45 100 36 90 32 72 C26 50 40 38 50 24 Z" style={{ fill: colors[0], transition: 'fill 3s ease-in-out', opacity: 0.5 }} />
</svg>
<span className="flame-level">{level}</span>
</div>
);
}

function FlashcardsGame({ set, savedIds, onToggleSaved, onFinish, onExit, voiceSettings, onReview, onGameComplete }) {

const [isAnswering, setIsAnswering] = useState(false);

useEffect(() => {
if (idx >= cards.length) {

onFinish(results, initialCards);
} else {
setIdx(cards.length - 1);
}
}
}, [cards.length, idx]);
useEffect(() => { setShowTranslation(false); setIsAnswering(false); }, [idx]);
const cardLang1 = card?.lang1 || set.lang1;
const cardLang2 = card?.lang2 || set.lang2;
const speakFront = useCallback(() => {
if (card) speakText(card.word, cardLang1);
}, [card, cardLang1, speakText]);
const speakBack = useCallback(() => {
if (card) speakText(card.translation, cardLang2);
}, [card, cardLang2, speakText]);

setShowTranslation(prev => !prev);
};

if (onReview) onReview(ok);
const newResults = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
setResults(newResults);
setTimeout(() => {
if (idx + 1 >= cards.length) {
if (onGameComplete) onGameComplete();
onFinish(newResults, initialCards);
} else {
setIdx(idx + 1);
}

function MatchingGame({ set, savedIds, onToggleSaved, onFinish, onExit, onReview, onGameComplete }) {
const { t } = useI18n();
const { speakText } = useSpeech(0.9, 1.0);

const pairs = useMemo(() => isSanctuary ? initialPairs : initialPairs.filter(w => !savedIds.includes(w.id)), [initialPairs, savedIds, isSanctuary]);
const [leftWords, setLeftWords] = useState(() => shuffle(initialPairs));
const [rightTrans, setRightTrans] = useState(() => shuffle(initialPairs));
const [selA, setSelA] = useState(null);
const [selB, setSelB] = useState(null);
const [permanentMatchedIds, setPermanentMatchedIds] = useState([]);
const [greenFlashIds, setGreenFlashIds] = useState([]);
const [wrongFlashIds, setWrongFlashIds] = useState([]);
const [results, setResults] = useState([]);
useEffect(() => {
if (!selA || !selB) return;
const ok = selA.id === selB.id;
if (onReview) onReview(ok);
const res = [...results, { id: selA.id, correct: ok, word: selA.word, translation: selA.translation }];
setResults(res);
if (ok) {
setGreenFlashIds([selA.id]);
const newPermanent = [...permanentMatchedIds, selA.id];
setTimeout(() => {
setPermanentMatchedIds(newPermanent);
setGreenFlashIds([]);
setSelA(null); setSelB(null);
if (newPermanent.length >= pairs.length) {
if (onGameComplete) onGameComplete();
onFinish(res, initialPairs);
}
}, 1000);
} else {
setWrongFlashIds([selA.id, selB.id]);
setTimeout(() => {
setWrongFlashIds([]);
setSelA(null); setSelB(null);
}, 1000);
}
}, [selA, selB, pairs.length, permanentMatchedIds, results, initialPairs, onReview, onFinish, onGameComplete]);

</div>
);

const l2 = getLang(set.lang2);

</div>
</div>
<div className="match-game-layout" dir="ltr">
<div className="match-column-section">
<div className="match-column-header">{l2.name}</div>
<div className="match-column">
{rightFiltered.map(item => {
const isSelected = selB?.id === item.id;
const isGreen = greenFlashIds.includes(item.id);
const isWrong = wrongFlashIds.includes(item.id);
return (
<button type="button" key={item.id} className={`match-btn ${isSelected ? "selected" : ""} ${isGreen ? "green-flash" : ""} ${isWrong ? "wrong-flash" : ""}`} onClick={() => { if (!selA || !selB) setSelB(item); }}>
<div className="match-actions" onClick={(e) => e.stopPropagation()}>
<button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); onToggleSaved(item.id); }} aria-label="Save"><BookmarkIcon filled={savedIds.includes(item.id)} size={14} /></button>
<button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); speakText(item.translation, set.lang2); }} aria-label="Speak"><SpeakerIcon size={14} /></button>
</div>
<span className="match-text" dir={l2.dir}>{item.translation}</span>
</button>
);
})}
</div>
</div>
<div className="match-column-section">
<div className="match-column-header">{l1.name}</div>
<div className="match-column">
{leftFiltered.map(item => {
const isSelected = selA?.id === item.id;
const isGreen = greenFlashIds.includes(item.id);
const isWrong = wrongFlashIds.includes(item.id);
return (
<button type="button" key={item.id} className={`match-btn ${isSelected ? "selected" : ""} ${isGreen ? "green-flash" : ""} ${isWrong ? "wrong-flash" : ""}`} onClick={() => { if (!selA || !selB) setSelA(item); }}>
<div className="match-actions" onClick={(e) => e.stopPropagation()}>
<button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); onToggleSaved(item.id); }} aria-label="Save"><BookmarkIcon filled={savedIds.includes(item.id)} size={14} /></button>

</div>
<span className="match-text" dir={l1.dir}>{item.word}</span>
</button>
);
})}
</div>
</div>
</div>
</div>
);
}

function DicteeGame({ onExit, onGameComplete }) {
    const { t } = useI18n();
    const [state, setState] = useState("level_select");
    const [level, setLevel] = useState(null);
    const [session, setSession] = useState([]);
    const [idx, setIdx] = useState(0);
    const [userInput, setUserInput] = useState("");
    const [diffResult, setDiffResult] = useState(null);
    const [results, setResults] = useState([]);
    const audioRef = useRef(null);
    const [isPlaying, setIsPlaying] = useState(false);
    const [currentTime, setCurrentTime] = useState(0);
    const [duration, setDuration] = useState(0);

    const levels = ["A1", "A2", "B1", "B2", "C1", "C2"];

    const startLevel = (l) => {
        const bank = DICTEE_BANK[l];
        const shuffled = shuffle(bank).slice(0, 15);
        setSession(shuffled);
        setLevel(l);
        setIdx(0);
        setState("playing");
        setResults([]);
        if(onGameComplete) onGameComplete();
    };

    const currentText = session[idx] || "";
    const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=fr&client=tw-ob&q=${encodeURIComponent(currentText)}`;

    const togglePlay = () => { if (audioRef.current) { if (isPlaying) audioRef.current.pause(); else audioRef.current.play().catch(()=>{}); } };
    const seek = (e) => { if (audioRef.current) audioRef.current.currentTime = e.target.value; };
    const rewind = () => { if(audioRef.current) audioRef.current.currentTime = Math.max(0, audioRef.current.currentTime - 3); };
    const forward = () => { if(audioRef.current) audioRef.current.currentTime = Math.min(duration, audioRef.current.currentTime + 3); };
    const formatTime = (s) => { if (!s || isNaN(s)) return "0:00"; const m = Math.floor(s / 60); const sec = Math.floor(s % 60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; };

    useEffect(() => {
        if (state === "playing" && audioRef.current) {
            audioRef.current.load();
            audioRef.current.play().catch(() => {});
        }
    }, [idx, state]);

    const handleCorriger = () => {
        const res = getDiffResult(userInput, currentText);
        setDiffResult(res);
        setState("corrected");
        setResults(prev => [...prev, { text: currentText, ...res }]);
    };

    const handleNext = () => {
        if (idx + 1 >= session.length) {
            setState("finished");
        } else {
            setIdx(idx + 1);
            setUserInput("");
            setDiffResult(null);
            setState("playing");
        }
    };

    if (state === "level_select") {
        return (
            <div>
                <div className="game-header">
                    <button type="button" className="icon-btn" onClick={onExit} aria-label={t("back")}><CloseIcon /></button>
                    <div style={{ textAlign: "center", flex: 1 }}>
                        <div className="game-title">🎧 Dictée</div>
                        <div className="game-subtitle">Choisissez votre niveau</div>
                    </div>
                </div>
                <div className="dictee-level-grid">
                    {levels.map(l => (
                        <button key={l} className="dictee-level-btn" onClick={() => startLevel(l)}>{l}</button>
                    ))}
                </div>
            </div>
        );
    }

    if (state === "finished") {
        const totalCorrect = results.reduce((a, b) => a + b.correctCount, 0);
        const totalWords = results.reduce((a, b) => a + b.totalWords, 0);
        const pct = totalWords ? Math.round((totalCorrect / totalWords) * 100) : 0;
        const missingErrors = results.reduce((a, b) => a + b.correctTokens.filter(t => t.status === 'missing').length, 0);
        const extraErrors = results.reduce((a, b) => a + b.userTokens.filter(t => t.status === 'extra').length, 0);
        const wrongErrors = results.reduce((a, b) => a + b.userTokens.filter(t => t.status === 'wrong').length, 0);

        return (
            <div className="results-box glass">
                <div className="results-emoji">🎉</div>
                <h2>Dictée terminée !</h2>
                <div className="score-circle">{pct}%</div>
                <div className="muted">Score final: {totalCorrect} / {totalWords} mots</div>
                <div className="dictee-final-stats">
                    <div className="dictee-stat-card"><div className="dictee-stat-value">15/15</div><div className="dictee-stat-label">Dictées</div></div>
                    <div className="dictee-stat-card"><div className="dictee-stat-value">{pct}%</div><div className="dictee-stat-label">Précision</div></div>
                </div>
                <div className="wrong-words-section">
                    <div className="wrong-words-title">📊 Erreurs fréquentes</div>
                    <div className="word-row"><span>Mots manquants</span><strong>{missingErrors}</strong></div>
                    <div className="word-row"><span>Mots en trop</span><strong>{extraErrors}</strong></div>
                    <div className="word-row"><span>Orthographe / Conjugaison</span><strong>{wrongErrors}</strong></div>
                </div>
                <button type="button" className="btn btn-primary btn-block btn-lg" onClick={onExit}>🏠 {t("home")}</button>
            </div>
        );
    }

    return (
        <div>
            <div className="game-header">
                <button type="button" className="icon-btn" onClick={onExit} aria-label={t("back")}><CloseIcon /></button>
                <div style={{ textAlign: "center", flex: 1 }}>
                    <div className="game-title">Dictée {level}</div>
                    <div className="game-subtitle">{idx + 1} / {session.length}</div>
                </div>
            </div>
            
            <div className="dictee-player glass">
                <audio 
                    ref={audioRef} 
                    src={audioUrl} 
                    onTimeUpdate={() => setCurrentTime(audioRef.current.currentTime)}
                    onLoadedMetadata={() => setDuration(audioRef.current.duration)}
                    onPlay={() => setIsPlaying(true)}
                    onPause={() => setIsPlaying(false)}
                    onEnded={() => setIsPlaying(false)}
                />
                <div className="player-controls">
                    <button type="button" className="icon-btn" onClick={rewind}>⏪</button>
                    <button type="button" className="icon-btn play-btn" onClick={togglePlay}>
                        {isPlaying ? "⏸️" : "▶️"}
                    </button>
                    <button type="button" className="icon-btn" onClick={forward}>⏩</button>
                </div>
                <div className="player-seek">
                    <span>{formatTime(currentTime)}</span>
                    <input type="range" min="0" max={duration || 0} step="0.1" value={currentTime} onChange={seek} />
                    <span>{formatTime(duration)}</span>
                </div>
            </div>

            {state === "playing" && (
                <>
                    <textarea 
                        className="dictee-textarea" 
                        value={userInput} 
                        onChange={e => setUserInput(e.target.value)} 
                        placeholder="Écrivez ce que vous entendez..."
                        autoFocus
                    />
                    <button type="button" className="btn btn-primary btn-block btn-lg" onClick={handleCorriger} disabled={!userInput.trim()}>
                        Corriger
                    </button>
                </>
            )}

            {state === "corrected" && diffResult && (
                <div className="diff-result">
                    <div style={{textAlign: "center", marginBottom: 16}}>
                        <span style={{fontSize: 24, fontWeight: 900, color: "var(--primary)"}}>
                            {diffResult.correctCount} / {diffResult.totalWords} mots
                        </span>
                    </div>
                    <h4>Votre réponse</h4>
                    <div className="diff-text">
                        {diffResult.userTokens.map((t, i) => (
                            <span key={i} className={`diff-word ${t.status}`}>{t.text}</span>
                        ))}
                    </div>
                    <h4>Correction</h4>
                    <div className="diff-text">
                        {diffResult.correctTokens.map((t, i) => (
                            <span key={i} className={`diff-word ${t.status}`}>{t.text}</span>
                        ))}
                    </div>
                    <button type="button" className="btn btn-success btn-block btn-lg" onClick={handleNext}>
                        {idx + 1 >= session.length ? "Voir les résultats" : "Suivant ➡️"}
                    </button>
                </div>
            )}
        </div>
    );
}

function Results({ results, onRetry, onRetryWrong, onHome }) {
const { t } = useI18n();
const total = results.length;
const correct = results.filter(r => r.correct).length;
const pct = total ? Math.round((correct / total) * 100) : 0;
const wrong = results.filter(r => !r.correct);
let label = t("tryAgain"), msg = t("msgTryAgain"), emoji = "💪";
if (pct >= 90) { label = t("excellent"); msg = t("msgExcellent"); emoji = "🌟"; }
else if (pct >= 70) { label = t("good"); msg = t("msgGood"); emoji = "👏"; }
else if (pct >= 50) { label = t("fair"); msg = t("msgFair"); emoji = "👍"; }
return (
<div className="results-box glass">
<div className="results-emoji">{emoji}</div>
<h2 style={{ fontSize: 30, fontWeight: 900, marginBottom: 10 }}>{t("results")}</h2>
<div className="score-circle">{pct}%</div>
<div className="muted">{t("correctAnswers")}: <strong style={{ color: "var(--primary)", fontSize: 16 }}>{correct}/{total}</strong></div>
<div style={{ margin: "16px 0", fontWeight: 800, fontSize: 19 }}>{label}</div>
<div className="results-message">{msg}</div>
{wrong.length > 0 && (
<div className="wrong-words-section">
<div className="wrong-words-title"><CrossIcon size={16} color="#EF4444" /> {t("wrongWords")}</div>
{wrong.map((w, i) => (
<div key={i} className="word-row">
<div>
<div className="word-row-text">{w.word}</div>
<div className="word-row-translation">→ {w.translation}</div>
</div>
</div>
))}
</div>
)}
<button type="button" className="btn btn-primary btn-block btn-lg" onClick={onRetry}>🔄 {t("retry")}</button>
{wrong.length > 0 && (<button type="button" className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={onRetryWrong}>⭐ {t("retryWrong")}</button>)}
<button type="button" className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={onHome}>🏠 {t("home")}</button>
</div>
);
}

function SetEditor({ set, onBack, onUpdate, onDeleteWord, onWordAdded }) {
const { t } = useI18n();
const toast = useToast();
const { speakText } = useSpeech();
const [name, setName] = useState(set.name);
const [lang1, setLang1] = useState(set.lang1);
const [lang2, setLang2] = useState(set.lang2);
const [newWord, setNewWord] = useState({ word: "", translation: "" });
const [isTranslating, setIsTranslating] = useState(false);
const userEditedRef = useRef(false);
const translateTimerRef = useRef(null);
const abortRef = useRef(null);
useEffect(() => { setName(set.name); setLang1(set.lang1); setLang2(set.lang2); }, [set.id]);
const performTranslation = useCallback(async (text) => {
if (!text.trim()) { setNewWord(prev => ({ ...prev, translation: '' })); return; }
setIsTranslating(true);
if (abortRef.current) abortRef.current.abort();
const controller = new AbortController();
abortRef.current = controller;
try {
const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.trim())}&langpair=${lang1}|${lang2}`, { signal: controller.signal });
const data = await res.json();
const translated = data?.responseData?.translatedText;
if (translated && !translated.includes("MYMEMORY WARNING")) {
if (!userEditedRef.current) {
setNewWord(prev => ({ ...prev, translation: translated }));
}
}
} catch (err) {
if (err.name === 'AbortError') return;
} finally {
setIsTranslating(false);
}
}, [lang1, lang2]);
useEffect(() => {
if (newWord.word.trim().length < 2) {
setNewWord(prev => ({ ...prev, translation: '' }));
return;
}
userEditedRef.current = false;
clearTimeout(translateTimerRef.current);
translateTimerRef.current = setTimeout(() => performTranslation(newWord.word), 300);
return () => clearTimeout(translateTimerRef.current);
}, [newWord.word, performTranslation]);
useEffect(() => {
if (newWord.word.trim().length >= 2) {
userEditedRef.current = false;
clearTimeout(translateTimerRef.current);
translateTimerRef.current = setTimeout(() => performTranslation(newWord.word), 300);
}
}, [lang1, lang2]);
const saveSetInfo = () => { onUpdate({ ...set, name, lang1, lang2 }); toast(t("savedMsg"), "success"); };
const addWord = () => {
if (!newWord.word.trim() || !newWord.translation.trim()) {
toast("Fill both fields", "error");
return;
}
const word = { id: "w" + uid(), word: newWord.word.trim(), translation: newWord.translation.trim() };
const updatedSet = { ...set, words: [...set.words, word] };
onUpdate(updatedSet);
if (onWordAdded) onWordAdded();
setNewWord({ word: "", translation: "" });
toast(t("savedMsg"), "success");
};
const l1 = getLang(lang1);
const l2 = getLang(lang2);
return (
<div>
<div className="page-header">
<button type="button" className="btn btn-secondary" onClick={onBack}>← {t("back")}</button>
<h2><EditIcon size={20} /> {t("editor")}</h2>
</div>
<div className="editor-box glass">
<div className="field">
<label>{t("setName")}</label>
<input value={name} onChange={e => setName(e.target.value)} />
</div>
<div className="grid-2">
<div className="field">
<label>{t("firstLang")}</label>
<select value={lang1} onChange={e => setLang1(e.target.value)}>
{LANGS.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}
</select>
</div>
<div className="field">
<label>{t("secondLang")}</label>
<select value={lang2} onChange={e => setLang2(e.target.value)}>
{LANGS.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}
</select>
</div>
</div>
<button type="button" className="btn btn-primary" onClick={saveSetInfo}><CheckIcon size={16} color="white" /> {t("save")}</button>
</div>
<div className="editor-box glass">
<h3 style={{ marginBottom: 14, fontSize: 17, fontWeight: 800 }}><PlusIcon size={16} /> {t("addWord")}</h3>
<div className="field">
<label>{t("word")} ({l1.name})</label>
<input value={newWord.word} onChange={e => setNewWord({ ...newWord, word: e.target.value })} placeholder={`${t("word")} (${l1.name})`} />
{isTranslating && <div className="muted" style={{ marginTop: 8 }}>⏳ {t("translating")}</div>}
</div>
<div className="field">
<label>{t("translation")} ({l2.name})</label>
<input value={newWord.translation} onChange={e => { userEditedRef.current = true; setNewWord({ ...newWord, translation: e.target.value }); }} placeholder={`${t("translation")} (${l2.name})`} />
</div>
<button type="button" className="btn btn-success btn-block" onClick={addWord} disabled={!newWord.word.trim() || !newWord.translation.trim()}>
<PlusIcon size={16} /> {t("add")}
</button>
</div>
<div className="editor-box glass">
<h3 style={{ marginBottom: 14, fontSize: 17, fontWeight: 800 }}><BookIcon size={16} color="#8B5CF6" /> {t("words")} ({set.words.length})</h3>
{set.words.length === 0 && (
<div className="empty-state">
<div className="empty-icon"><BookIcon size={48} color="#8B5CF6" /></div>
<div className="empty-text">{t("noWords")}</div>
</div>
)}
{set.words.map(w => (
<div key={w.id} className="word-row">
<div className="word-row-main">
<div className="word-row-text">{w.word}</div>
<div className="word-row-translation">→ {w.translation}</div>
</div>
<div className="flex-row">
<button type="button" className="icon-btn danger" onClick={() => { if (confirm(t("confirmDeleteWord"))) { onDeleteWord(set.id, w.id); toast(t("deleted"), "info"); } }} aria-label="Delete"><TrashIcon /></button>
</div>
</div>
))}
</div>
</div>
);
}

{ type: "matching", name: t("matching"), color: "#EF4444", icon: <svg viewBox="0 0 48 48" fill="none"><rect x="4" y="6" width="16" height="16" rx="3" fill="white" stroke="#8B5CF6" strokeWidth="2"/><rect x="28" y="26" width="16" height="16" rx="3" fill="white" stroke="#8B5CF6" strokeWidth="2"/><path d="M20 14h4a4 4 0 0 1 4 4v10" stroke="#8B5CF6" strokeWidth="2.5" fill="none" strokeLinecap="round"/><circle cx="12" cy="14" r="2" fill="#8B5CF6"/><circle cx="36" cy="34" r="2" fill="#8B5CF6"/></svg> },
{ type: "sentence", name: t("sentenceGame"), color: "#8B5CF6", icon: <SentenceIcon size={48} /> },
{ type: "dictee", name: "Dictée", color: "#6D28D9", icon: <svg viewBox="0 0 48 48" fill="none"><rect x="8" y="6" width="32" height="36" rx="4" fill="white" stroke="#8B5CF6" strokeWidth="2"/><path d="M16 16h16M16 24h16M16 32h10" stroke="#8B5CF6" strokeWidth="2" strokeLinecap="round"/><circle cx="36" cy="36" r="8" fill="#8B5CF6"/><path d="M34 36l2 2 4-4" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg> }
];
const hideNav = view === 'game' || view === 'editor' || view === 'results' || modal !== null;
return (
<div className="app">
{view === "home" && (
<div>
{mainTab === 'games' && (
<div className="tab-content">
<div className="topbar">
<div className="site-logo" onClick={() => setView("home")}>
<h1><BookIcon size={24} color="#8B5CF6" /> {t("appName")}</h1>
<div className="tagline">{t("tagline")}</div>
</div>
</div>
<ProfileCard user={user} usage={usage} savedCount={savedWords.length} onAvatarClick={() => document.getElementById("avatar-upload").click()} />
<input type="file" id="avatar-upload" accept="image/*" style={{ display: "none" }} onChange={e => handleAvatarUpload(e.target.files[0])} />
<div style={{ marginTop: 20 }}>
<SelectSetDropdown sets={sets} currentSetId={currentSetId} onSelect={id => setCurrentSetId(id)} onEdit={id => { setCurrentSetId(id); setView("editor"); }} onDelete={deleteSet} onCreate={() => setModal("createSet")} />
<Sanctuary count={savedWords.length} onPlay={() => startGame("saved")} />
<div className="games-header-wrap">
<div className="games-header-title"><span className="header-emoji"><GamepadIcon size={28} color="#8B5CF6" /></span> {t("games")}</div>
<div className="games-header-desc"><RocketIcon size={14} color="#8B5CF6" /> {t("gamesDesc")}</div>
</div>
<div className="games-grid">
{games.map(g => (
<div key={g.type} className="game-card" onClick={() => startGame(g.type)}>
<div className="game-icon-wrap" style={{ background: `${g.color}20` }}>{g.icon}</div>
<div className="game-name">{g.name}</div>
</div>
))}
</div>
</div>
</div>
)}
{mainTab === 'stats' && (<ActivityView usage={usage} totalWords={totalWords} stats={stats} />)}
{mainTab === 'settings' && (
<div className="tab-content">
<div className="topbar">
<div className="site-logo">
<h1>{t("settings")}</h1>
</div>
</div>
<ProfileCard user={user} usage={usage} savedCount={savedWords.length} onAvatarClick={() => document.getElementById("avatar-upload2").click()} />
<input type="file" id="avatar-upload2" accept="image/*" style={{ display: "none" }} onChange={e => handleAvatarUpload(e.target.files[0])} />
<div style={{ marginTop: 20 }}>
<div className="theme-toggle-row" onClick={toggleTheme}>
<span className="theme-toggle-label">
{theme === "light" ? <MoonIcon size={20} /> : <SunIcon size={20} />}
{theme === "light" ? t("darkMode") : t("lightMode")}
</span>
<div className={`theme-toggle-switch ${theme === "dark" ? "active" : ""}`} />
</div>
{!user ? (
<button type="button" className="btn btn-primary btn-block" onClick={() => setModal("login")} style={{ marginTop: 10 }}>
🔐 {t("login")}
</button>
) : (
<button type="button" className="btn btn-danger btn-block" onClick={() => { setUser(null); toast(t("logout"), "info"); }} style={{ marginTop: 10 }}>
🚪 {t("logout")}
</button>
)}
<button type="button" className="btn btn-secondary btn-block" onClick={() => setModal("settings")} style={{ marginTop: 10 }}>
⚙️ {t("settings")}
</button>
</div>
</div>
)}
</div>
)}
{view === "editor" && currentSet && (
<SetEditor set={currentSet} onBack={() => setView("home")} onUpdate={updateSet} onDeleteWord={deleteWord} onWordAdded={trackWordAdded} />
)}
{view === "game" && (gameSet || gameType === "dictee") && (
<div>
{(gameType === "flashcards" || gameType === "saved") && (
<FlashcardsGame key={gameKey} set={gameSet} savedIds={savedIds} onToggleSaved={toggleSaved} onFinish={finishGame} onExit={() => setView("home")} voiceSettings={voiceSettings} onReview={trackReview} onGameComplete={trackGame} />
)}
{gameType === "mcq" && (
<MCQGame key={gameKey} set={gameSet} savedIds={savedIds} onToggleSaved={toggleSaved} onFinish={finishGame} onExit={() => setView("home")} voiceSettings={voiceSettings} onReview={trackReview} onGameComplete={trackGame} />
)}
{gameType === "spelling" && (
<SpellingGame key={gameKey} set={gameSet} savedIds={savedIds} onToggleSaved={toggleSaved} onFinish={finishGame} onExit={() => setView("home")} voiceSettings={voiceSettings} onReview={trackReview} onGameComplete={trackGame} />
)}
{gameType === "matching" && (
<MatchingGame key={gameKey} set={gameSet} savedIds={savedIds} onToggleSaved={toggleSaved} onFinish={finishGame} onExit={() => setView("home")} onReview={trackReview} onGameComplete={trackGame} />
)}
{gameType === "sentence" && (
<SentenceGame key={gameKey} set={gameSet} savedIds={savedIds} onToggleSaved={toggleSaved} onFinish={finishGame} onExit={() => setView("home")} voiceSettings={voiceSettings} onReview={trackReview} onGameComplete={trackGame} />
)}
{gameType === "dictee" && (
<DicteeGame key={gameKey} onExit={() => setView("home")} onGameComplete={trackGame} />
)}
</div>
)}
{view === "results" && gameResults && (
<Results results={gameResults} onRetry={() => { setRetryWrong(false); setGameKey(Date.now()); setView("game"); }} onRetryWrong={() => { setRetryWrong(true); setGameKey(Date.now()); setView("game"); }} onHome={() => setView("home")} />
)}
{modal === "createSet" && (
<div className="modal-overlay" onClick={() => setModal(null)}>
<div className="modal" onClick={e => e.stopPropagation()}>
<h3><PlusIcon size={20} /> {t("createSet")}</h3>
<div className="field">
<label>{t("setName")}</label>
<input value={newSet.name} onChange={e => setNewSet({ ...newSet, name: e.target.value })} autoFocus />
</div>
<div className="grid-2">
<div className="field">
<label>{t("firstLang")}</label>
<select value={newSet.lang1} onChange={e => setNewSet({ ...newSet, lang1: e.target.value })}>
{langs.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}
</select>
</div>
<div className="field">
<label>{t("secondLang")}</label>
<select value={newSet.lang2} onChange={e => setNewSet({ ...newSet, lang2: e.target.value })}>
{langs.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}
</select>
</div>
</div>
<div className="modal-actions">
<button type="button" className="btn btn-secondary" onClick={() => setModal(null)}>{t("cancel")}</button>
<button type="button" className="btn btn-primary" onClick={createSet}>{t("save")}</button>
</div>
</div>
</div>
)}
{modal === "settings" && (
<div className="modal-overlay" onClick={() => setModal(null)}>
<div className="modal" onClick={e => e.stopPropagation()}>
<h3>{t("settings")}</h3>
<div className="tabs">
<div className={`tab ${settingsTab === "general" ? "active" : ""}`} onClick={() => setSettingsTab("general")}>🌍 {t("language")}</div>
<div className={`tab ${settingsTab === "voice" ? "active" : ""}`} onClick={() => setSettingsTab("voice")}><SpeakerIcon size={14} /> {t("voiceSettings")}</div>
<div className={`tab ${settingsTab === "data" ? "active" : ""}`} onClick={() => setSettingsTab("data")}><BookIcon size={14} color="#8B5CF6" /> Backup</div>
</div>
{settingsTab === "general" && (
<div>
<div className="field">
<label>🌍 {t("language")}</label>
<select value={locale} onChange={e => setLocale(e.target.value)}>
{langs.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}
</select>
</div>
</div>
)}
{settingsTab === "voice" && (
<div>
<div className="field">
<label>⚡ {t("speechRate")}: {voiceSettings.rate.toFixed(2)}</label>
<div className="slider-wrap">
<span>🐢</span>
<input type="range" min="0.5" max="1.5" step="0.05" value={voiceSettings.rate} onChange={e => setVoiceSettings({ ...voiceSettings, rate: parseFloat(e.target.value) })} />
<span>🐇</span>
<span className="slider-value">{voiceSettings.rate.toFixed(2)}</span>
</div>
</div>
<div className="field">
<label>🎵 {t("pitch")}: {voiceSettings.pitch.toFixed(2)}</label>
<div className="slider-wrap">
<span>⬇</span>
<input type="range" min="0.5" max="1.5" step="0.05" value={voiceSettings.pitch} onChange={e => setVoiceSettings({ ...voiceSettings, pitch: parseFloat(e.target.value) })} />
<span>⬆</span>
<span className="slider-value">{voiceSettings.pitch.toFixed(2)}</span>
</div>
</div>
</div>
)}
{settingsTab === "data" && (
<div>
<div className="field">
<label><BookIcon size={14} color="#8B5CF6" /> {t("exportData")}</label>
<button type="button" className="btn btn-primary btn-block" onClick={handleExport}>📥 Download Backup</button>
</div>
<div className="field">
<label><BookIcon size={14} color="#8B5CF6" /> {t("importData")}</label>
<div className="file-upload-wrap">
<FolderIcon size={18} /> Choose backup file
<input type="file" accept=".json" onChange={e => handleImport(e.target.files[0])} />
</div>
</div>
<div className="field" style={{ marginTop: 20 }}>
<label>⚠️ {t("resetAll")}</label>
<button type="button" className="btn btn-danger btn-block" onClick={handleReset}>🗑️ {t("resetAll")}</button>
</div>
</div>
)}
<div className="modal-actions">
<button type="button" className="btn btn-primary btn-block" onClick={() => setModal(null)}>{t("close")}</button>
</div>
</div>
</div>
)}
{modal === "login" && (
<div className="modal-overlay" onClick={() => setModal(null)}>
<div className="modal" onClick={e => e.stopPropagation()}>
<h3>🔐 {t("login")}</h3>
<div className="field">
<label>{t("name")}</label>
<input value={loginData.name} onChange={e => setLoginData({ ...loginData, name: e.target.value })} autoFocus />
</div>
<div className="field">
<label>{t("email")}</label>
<input value={loginData.email} onChange={e => setLoginData({ ...loginData, email: e.target.value })} type="email" />
</div>
<div className="modal-actions">
<button type="button" className="btn btn-secondary" onClick={() => setModal(null)}>{t("cancel")}</button>
<button type="button" className="btn btn-primary" onClick={() => { if (!loginData.name.trim()) return; setUser({ name: loginData.name.trim(), email: loginData.email.trim() }); setModal(null); toast(t("savedMsg"), "success"); }}>{t("login")}</button>
</div>
</div>
</div>
)}
{!hideNav && <BottomNav activeTab={mainTab} onTabChange={setMainTab} t={t} />}
</div>
);
}
function Root() {
return (
<ErrorBoundary>
<I18nProvider>
<ThemeProvider>
<ToastProvider>
<AppContent />
</ToastProvider>
</ThemeProvider>
</I18nProvider>
</ErrorBoundary>
);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
