<style>
:root {
--primary: #8B5CF6;
--primary-dark: #7C3AED;
--secondary: #6D28D9;
--accent: #C4B5FD;
--success: #10B981;
--success-light: rgba(16, 185, 129, 0.15);
--warning: #F59E0B;
--warning-light: rgba(245, 158, 11, 0.15);
--danger: #EF4444;
--danger-light: rgba(239, 68, 68, 0.15);
--info: #8B5CF6;
--bg-start: #FFFFFF;
--bg-end: #F4F4F5;
--text: #18181B;
--text-light: #3F3F46;
--text-muted: #71717A;
--glass-bg: rgba(255, 255, 255, 0.75);
--glass-bg-strong: rgba(255, 255, 255, 0.92);
--glass-border: rgba(0, 0, 0, 0.08);
--glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
--glass-shadow-deep: 0 20px 60px rgba(0, 0, 0, 0.12);
--radius: 24px;
--radius-sm: 14px;
--radius-lg: 28px;
--card-bg: #FFFFFF;
--card-border: rgba(0, 0, 0, 0.08);
--input-bg: rgba(255, 255, 255, 0.95);
--input-border: rgba(139, 92, 246, 0.25);
--shadow-color: 0, 0, 0;
--nav-height: 72px;
--safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
--bg-start: #18181B;
--bg-end: #0C0A09;
--text: #FAFAFA;
--text-light: #D4D4D8;
--text-muted: #A1A1AA;
--glass-bg: rgba(24, 24, 27, 0.75);
--glass-bg-strong: rgba(24, 24, 27, 0.92);
--glass-border: rgba(255, 255, 255, 0.10);
--glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.40);
--glass-shadow-deep: 0 20px 60px rgba(0, 0, 0, 0.50);
--card-bg: #27272A;
--card-border: rgba(255, 255, 255, 0.08);
--input-bg: rgba(39, 39, 42, 0.95);
--input-border: rgba(255, 255, 255, 0.12);
--shadow-color: 255, 255, 255;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
input, textarea, select, button { font-family: inherit; }
html, body {
font-family: 'Tajawal', 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
color: var(--text);
min-height: 100vh;
overflow-x: hidden;
line-height: 1.6;
letter-spacing: 0.01em;
transition: background 0.4s ease, color 0.3s ease;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
body { background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%); background-attachment: fixed; }
body::before {
content: '';
position: fixed; inset: 0;
background-image: radial-gradient(circle at 20% 30%, rgba(139,92,246,0.06) 0%, transparent 40%),
radial-gradient(circle at 80% 70%, rgba(139,92,246,0.06) 0%, transparent 40%);
pointer-events: none; z-index: 0;
}
#root { position: relative; z-index: 1; min-height: 100vh; }
.app {
max-width: 780px; margin: 0 auto; padding: 20px;
padding-bottom: calc(110px + var(--safe-bottom));
min-height: 100vh; font-size: clamp(14px, 4vw, 16px);
}
.site-logo h1 { font-size: clamp(22px, 6vw, 32px); }
.site-logo .tagline { font-size: clamp(11px, 3vw, 13px); }
.game-title { font-size: clamp(15px, 4vw, 17px); }
.game-subtitle { font-size: clamp(11px, 3vw, 12px); }
.profile-greeting { font-size: clamp(18px, 5vw, 22px); }
.profile-note { font-size: clamp(12px, 3.2vw, 13px); }
.games-header-title { font-size: clamp(20px, 5.5vw, 26px); }
.games-header-desc { font-size: clamp(12px, 3.2vw, 13px); }
.section-title { font-size: clamp(16px, 4.5vw, 20px); }
.glass {
background: var(--glass-bg);
backdrop-filter: blur(25px) saturate(180%);
-webkit-backdrop-filter: blur(25px) saturate(180%);
border: 1px solid var(--glass-border);
box-shadow: var(--glass-shadow);
border-radius: var(--radius);
transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.glass:hover { box-shadow: var(--glass-shadow-deep); }
.btn {
border: none; border-radius: var(--radius-sm);
padding: 13px 22px; font-size: clamp(14px, 3.8vw, 15px);
font-weight: 700; cursor: pointer;
transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
display: inline-flex; align-items: center; justify-content: center;
gap: 8px; min-height: 44px; min-width: 44px;
letter-spacing: 0.02em; position: relative; overflow: hidden;
touch-action: manipulation;
}
.btn::before {
content: ''; position: absolute; top: 50%; left: 50%;
width: 0; height: 0; border-radius: 50%;
background: rgba(255,255,255,0.3);
transform: translate(-50%, -50%);
transition: width 0.6s, height 0.6s;
}
.btn:active::before { width: 300px; height: 300px; }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(var(--shadow-color), 0.15); }
.btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 6px 20px rgba(139,92,246,0.4); }
.btn-success { background: linear-gradient(135deg, #10B981, #059669); color: white; box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
.btn-danger { background: linear-gradient(135deg, #EF4444, #DC2626); color: white; box-shadow: 0 6px 20px rgba(239,68,68,0.4); }
.btn-secondary { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); color: var(--text); border: 1px solid var(--glass-border); }
[data-theme="dark"] .btn-secondary { background: rgba(39,39,42,0.85); border-color: rgba(255,255,255,0.12); }
.btn-block { width: 100%; }
.btn-lg { padding: 16px 28px; font-size: clamp(15px, 4vw, 17px); min-height: 56px; }
.icon-btn {
background: rgba(255,255,255,0.3); backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,0.3); font-size: 18px;
cursor: pointer; padding: 10px; border-radius: 12px;
transition: all 0.2s; min-width: 44px; min-height: 44px;
display: flex; align-items: center; justify-content: center; color: var(--text);
touch-action: manipulation;
}
.icon-btn:hover { background: rgba(139,92,246,0.15); transform: scale(1.08); color: var(--primary); }
.icon-btn.danger:hover { background: var(--danger-light); color: var(--danger); }
[data-theme="dark"] .icon-btn { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.08); }
[data-theme="dark"] .icon-btn:hover { background: rgba(139,92,246,0.2); }
.muted { color: var(--text-light); font-size: 13px; font-weight: 500; }
.flex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.site-logo { cursor: pointer; }
.site-logo h1 {
font-weight: 900;
background: linear-gradient(135deg, #8B5CF6 0%, #18181B 100%);
-webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
display: flex; align-items: center; gap: 10px;
letter-spacing: -0.02em;
}
[data-theme="dark"] .site-logo h1 { background: linear-gradient(135deg, #C4B5FD 0%, #FFFFFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.site-logo .tagline { color: var(--text-light); font-weight: 500; margin-top: 2px; }
.brand-mark { flex-shrink: 0; filter: drop-shadow(0 5px 10px rgba(139,92,246,0.28)); }
.brand-mark-petal { transform-origin: 12px 12px; animation: brandPetalFloat 4s ease-in-out infinite; }
@keyframes brandPetalFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-1px) rotate(3deg); } }
.profile-card {
background: var(--glass-bg-strong);
backdrop-filter: blur(25px) saturate(180%);
border: 1px solid var(--glass-border);
border-radius: var(--radius-lg); padding: 26px;
box-shadow: var(--glass-shadow-deep);
position: relative; overflow: hidden;
}
.profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; position: relative; z-index: 2; }
.avatar {
width: clamp(80px, 20vw, 120px); height: clamp(80px, 20vw, 120px);
border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary));
color: white; display: flex; align-items: center; justify-content: center;
font-size: clamp(32px, 8vw, 44px); font-weight: 900; flex-shrink: 0;
box-shadow: 0 0 0 4px rgba(139,92,246,0.3), 0 12px 32px rgba(139,92,246,0.4);
position: relative; overflow: hidden; cursor: pointer;
transition: all 0.3s; border: 3px solid rgba(255,255,255,0.7);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-info { flex: 1; min-width: 0; }
.profile-greeting { font-weight: 800; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
.profile-note { color: var(--text-light); line-height: 1.5; font-weight: 500; }
.profile-stats {
display: flex; gap: 20px; flex-wrap: wrap; padding-top: 18px;
border-top: 1px solid rgba(139,92,246,0.2); position: relative; z-index: 2;
}
.stat-item { display: flex; align-items: center; gap: 10px; font-size: clamp(12px, 3.5vw, 14px); color: var(--text-light); font-weight: 600; }
.stat-item .value { color: var(--text); font-weight: 800; font-size: clamp(15px, 4vw, 17px); }
.stat-item .stat-label { font-size: clamp(11px, 3vw, 12px); color: var(--text-light); font-weight: 600; }
.flame-container {
width: clamp(48px, 12vw, 58px); height: clamp(58px, 14vw, 70px);
position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.flame-svg { width: 100%; height: 100%; animation: flameFlicker 2.2s ease-in-out infinite; transform-origin: bottom center; }
@keyframes flameFlicker {
0%, 100% { transform: scaleY(1) scaleX(1); }
15% { transform: scaleY(0.94) scaleX(1.03); }
30% { transform: scaleY(1.04) scaleX(0.97); }
45% { transform: scaleY(0.96) scaleX(1.02); }
60% { transform: scaleY(1.03) scaleX(0.96); }
75% { transform: scaleY(0.95) scaleX(1.04); }
90% { transform: scaleY(1.02) scaleX(0.98); }
}
.flame-level {
position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
font-weight: 900; font-size: clamp(13px, 3.5vw, 16px);
color: white; text-shadow: 0 1px 4px rgba(0,0,0,0.4);
z-index: 5; pointer-events: none;
}
.flame-red .flame-svg { filter: drop-shadow(0 3px 12px rgba(239,68,68,0.7)); }
.flame-white .flame-svg { filter: drop-shadow(0 3px 12px rgba(255,255,255,0.7)); }
.flame-blue .flame-svg { filter: drop-shadow(0 3px 12px rgba(59,130,246,0.7)); }
.flame-purple .flame-svg { filter: drop-shadow(0 3px 12px rgba(139,92,246,0.7)); }
.flame-rainbow .flame-svg { animation: flameFlicker 2.2s ease-in-out infinite, rainbowGlow 12s linear infinite; }
@keyframes rainbowGlow {
0%, 100% { filter: drop-shadow(0 3px 12px rgba(239,68,68,0.8)); }
25% { filter: drop-shadow(0 3px 12px rgba(255,255,255,0.8)); }
50% { filter: drop-shadow(0 3px 12px rgba(59,130,246,0.8)); }
75% { filter: drop-shadow(0 3px 12px rgba(139,92,246,0.8)); }
}
.dropdown-wrapper { position: relative; margin-bottom: 18px; }
.dropdown-trigger {
width: 100%; padding: 16px 20px;
background: var(--glass-bg-strong); backdrop-filter: blur(20px);
border: 1px solid var(--input-border); border-radius: var(--radius);
font-size: clamp(14px, 3.8vw, 16px); font-weight: 700; cursor: pointer;
display: flex; justify-content: space-between; align-items: center;
min-height: 54px; color: var(--text); transition: all 0.3s;
touch-action: manipulation;
}
.dropdown-trigger:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(139,92,246,0.2); }
.dropdown-trigger .arrow { transition: transform 0.3s; font-size: 14px; color: var(--primary); display: flex; align-items: center; }
.dropdown-trigger .arrow.open { transform: rotate(180deg); }
.dropdown-menu {
position: absolute; top: calc(100% + 10px); left: 0; right: 0;
background: var(--glass-bg-strong); backdrop-filter: blur(30px);
border: 1px solid var(--glass-border); border-radius: var(--radius);
box-shadow: 0 24px 64px rgba(var(--shadow-color), 0.2); z-index: 50;
max-height: 420px; overflow-y: auto; padding: 10px;
animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
.dropdown-search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--input-border); background: var(--input-bg); margin-bottom: 10px; font-size: 14px; color: var(--text); }
.dropdown-search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
.dropdown-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
.dropdown-item:hover { background: rgba(139,92,246,0.08); }
.dropdown-item-main { flex: 1; min-width: 0; }
.dropdown-item-name { font-weight: 700; font-size: 14px; color: var(--text); }
.dropdown-item-meta { font-size: 12px; color: var(--text-light); margin-top: 3px; }
.dropdown-item-actions { display: flex; gap: 6px; }
.dropdown-item.primary { background: linear-gradient(135deg, rgba(139,92,246,0.12), rgba(109,40,217,0.12)); color: var(--primary); font-weight: 700; justify-content: center; margin-top: 10px; border: 1px dashed rgba(139,92,246,0.4); }
.dropdown-item.essential {
background: linear-gradient(135deg, rgba(139,92,246,0.16), rgba(196,181,253,0.14));
border: 1.5px dashed rgba(139,92,246,0.55);
margin-bottom: 8px;
padding: 14px 16px;
position: relative;
}
.dropdown-item.essential:hover {
background: linear-gradient(135deg, rgba(139,92,246,0.24), rgba(196,181,253,0.20));
border-color: var(--primary);
transform: translateY(-1px);
box-shadow: 0 8px 20px rgba(139,92,246,0.18);
}
.dropdown-item.essential .dropdown-item-name { font-weight: 900; font-size: 14.5px; color: var(--primary); }
.essential-folder-emoji {
display: flex;
align-items: center;
justify-content: center;
margin-right: 14px;
flex-shrink: 0;
line-height: 1;
filter: drop-shadow(0 3px 6px rgba(139,92,246,0.35));
}
[dir="rtl"] .essential-folder-emoji { margin-right: 0; margin-left: 14px; }
.essential-badge {
background: linear-gradient(135deg, var(--primary), var(--secondary));
color: #fff;
font-size: 11px;
font-weight: 900;
padding: 5px 12px;
border-radius: 999px;
flex-shrink: 0;
letter-spacing: 0.04em;
box-shadow: 0 3px 10px rgba(139,92,246,0.4);
}
.essential-preview { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 16px; max-height: 190px; overflow-y: auto; }
.essential-preview-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--text); }
.essential-preview-row:nth-child(odd) { background: rgba(139,92,246,0.06); }
.essential-more { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-light); padding: 8px 0 2px; }
.sanctuary {
background: linear-gradient(135deg, #FAFAFA 0%, #EDE9FE 40%, #DDD6FE 100%);
border: 2px solid rgba(139,92,246,0.25); border-radius: var(--radius-lg);

box-shadow: 0 12px 40px rgba(139,92,246,0.15);
}
[data-theme="dark"] .sanctuary { background: linear-gradient(135deg, #18181B 0%, #27272A 40%, #3F3F46 100%); border-color: rgba(139,92,246,0.4); }
.sanctuary-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; position: relative; z-index: 2; }
.sanctuary-info { display: flex; align-items: center; gap: 14px; }
.sanctuary-icon { font-size: clamp(32px, 8vw, 44px); animation: floatCastle 4s ease-in-out infinite; }
@keyframes floatCastle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.sanctuary-title { font-size: clamp(16px, 4.5vw, 19px); font-weight: 900; color: #18181B; }
[data-theme="dark"] .sanctuary-title { color: #FAFAFA; }
.sanctuary-subtitle { font-size: clamp(11px, 3.2vw, 13px); color: #3F3F46; font-weight: 600; }
[data-theme="dark"] .sanctuary-subtitle { color: #D4D4D8; }
.sanctuary-count { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.75); padding: 4px 14px; border-radius: 20px; font-size: clamp(10px, 3vw, 12px); color: #18181B; font-weight: 800; margin-top: 6px; }
[data-theme="dark"] .sanctuary-count { background: rgba(24,24,27,0.75); color: #FAFAFA; }
.btn-gold { background: linear-gradient(135deg, #8B5CF6, #C4B5FD); color: white; box-shadow: 0 6px 20px rgba(139,92,246,0.5); font-weight: 800; }
[data-theme="dark"] .btn-gold { color: white; }
.games-header-wrap { margin: 28px 0 6px; }
.games-header-title {
font-weight: 900;
background: linear-gradient(135deg, #8B5CF6 0%, #18181B 50%, #C4B5FD 100%);
-webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em;
}
[data-theme="dark"] .games-header-title { background: linear-gradient(135deg, #C4B5FD 0%, #FFFFFF 50%, #8B5CF6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.games-header-desc { color: var(--text-light); font-weight: 600; margin-top: 4px; padding-left: 44px; opacity: 0.85; }
.games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(10px, 2vw, 14px); margin-bottom: 20px; }
.game-card {
background: var(--glass-bg-strong); backdrop-filter: blur(20px);
border: 1px solid var(--glass-border);
padding: clamp(14px, 3.5vw, 18px) clamp(10px, 2.5vw, 12px);
border-radius: var(--radius); cursor: pointer;

.game-icon-wrap { width: clamp(44px, 11vw, 54px); height: clamp(44px, 11vw, 54px); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; border-radius: 16px; transition: transform 0.3s; }

.game-name { font-size: clamp(11px, 3vw, 13px); font-weight: 800; color: var(--text); }
.flashcard-game { max-width: 660px; margin: 0 auto; }
.dual-card-container {
display: flex;
flex-direction: row;
gap: 20px;
width: 92%;
max-width: 600px;
margin: 28px auto;
min-height: 340px;
-webkit-user-select: none;
user-select: none;
-webkit-touch-callout: none;
justify-content: center;
align-items: stretch;
}

.dual-card-container { flex-direction: column; align-items: center; }
}

}
.dual-card-french,
.dual-card-arabic {

function getDiffResult(userText, correctText) {
  const clean = t => t.toLowerCase().replace(/[-'’`.,\/#!$%\^&\*;:{}=\-_~()]/g, ' ').replace(/\s+/g, ' ').trim();
  const uWords = clean(userText).split(' ');
  const cWords = clean(correctText).split(' ');
  const uOriginal = userText.trim().split(/\s+/);
  const cOriginal = correctText.trim().split(/\s+/);

  const m = uWords.length, n = cWords.length;
  const dp = Array(m + 1).fill(0).map(() => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = uWords[i-1] === cWords[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }

  const ops = [];
  let i = m, j = n;
  while (i > 0 && j > 0) {
    if (uWords[i-1] === cWords[j-1]) { ops.push({ type: 'match', u: i-1, c: j-1 }); i--; j--; }
    else if (dp[i-1][j] >= dp[i][j-1]) { ops.push({ type: 'extra', u: i-1 }); i--; }
    else { ops.push({ type: 'missing', c: j-1 }); j--; }
  }
  while (i > 0) { ops.push({ type: 'extra', u: i-1 }); i--; }
  while (j > 0) { ops.push({ type: 'missing', c: j-1 }); j--; }
  ops.reverse();

  const finalUser = [];
  const finalCorrect = [];
  for (let k = 0; k < ops.length; k++) {
    if (ops[k].type === 'extra' && ops[k+1] && ops[k+1].type === 'missing') {
      finalUser.push({ text: uOriginal[ops[k].u], status: 'wrong' });
      finalCorrect.push({ text: cOriginal[ops[k+1].c], status: 'wrong' });
      k++;
    } else if (ops[k].type === 'missing' && ops[k+1] && ops[k+1].type === 'extra') {
      finalCorrect.push({ text: cOriginal[ops[k].c], status: 'wrong' });
      finalUser.push({ text: uOriginal[ops[k+1].u], status: 'wrong' });
      k++;
    } else if (ops[k].type === 'match') {
      finalUser.push({ text: uOriginal[ops[k].u], status: 'correct' });
      finalCorrect.push({ text: cOriginal[ops[k].c], status: 'correct' });
    } else if (ops[k].type === 'extra') {
      finalUser.push({ text: uOriginal[ops[k].u], status: 'extra' });
    } else if (ops[k].type === 'missing') {
      finalCorrect.push({ text: cOriginal[ops[k].c], status: 'missing' });
    }
  }
  const correctCount = finalUser.filter(w => w.status === 'correct').length;
  const totalWords = cWords.length;
  return { userTokens: finalUser, correctTokens: finalCorrect, correctCount, totalWords };
}

function useSpeech(defaultRate = 0.9, defaultPitch = 1.0) {

function FlameIconEnhanced({ level = 0 }) {
  const [rainbowPhase, setRainbowPhase] = useState(0);
  useEffect(() => {
    if (level >= 60) {
      const interval = setInterval(() => setRainbowPhase(p => (p + 1) % 4), 3000);
      return () => clearInterval(interval);
    }
  }, [level]);
  let colorClass = 'flame-red';
  let gradientId = 'flameGradRed';
  let colors = ['#FEE2E2', '#F87171', '#EF4444'];
  if (level >= 60) {
    colorClass = 'flame-rainbow';
    gradientId = 'flameGradRainbow';
    const phases = [['#FEE2E2', '#F87171', '#EF4444'],['#FFFFFF', '#E5E7EB', '#9CA3AF'],['#DBEAFE', '#3B82F6', '#1D4ED8'],['#EDE9FE', '#8B5CF6', '#6D28D9']];
    colors = phases[rainbowPhase];
  } else if (level >= 45) { colorClass = 'flame-purple'; gradientId = 'flameGradPurple'; colors = ['#EDE9FE', '#8B5CF6', '#6D28D9']; }
  else if (level >= 30) { colorClass = 'flame-blue'; gradientId = 'flameGradBlue'; colors = ['#DBEAFE', '#3B82F6', '#1D4ED8']; }
  else if (level >= 15) { colorClass = 'flame-white'; gradientId = 'flameGradWhite'; colors = ['#FFFFFF', '#E5E7EB', '#9CA3AF']; }
  return (
    <div className={`flame-container ${colorClass}`}>
      <svg viewBox="0 0 100 120" className="flame-svg" role="img" aria-label={`Level ${level}`}>
        <defs>
          <radialGradient id={gradientId} cx="50%" cy="35%" r="65%">
            <stop offset="0%" style={{ stopColor: colors[0], transition: 'stop-color 3s ease-in-out' }} />
            <stop offset="45%" style={{ stopColor: colors[1], transition: 'stop-color 3s ease-in-out' }} />
            <stop offset="100%" style={{ stopColor: colors[2], transition: 'stop-color 3s ease-in-out' }} />
          </radialGradient>
        </defs>
        <path d="M50 4 C66 22 88 40 82 72 C78 100 60 114 50 114 C40 114 22 100 18 72 C12 40 34 22 50 4 Z" fill={`url(#${gradientId})`} opacity="0.96"/>
        <path d="M50 24 C60 38 74 50 68 72 C64 90 55 100 50 100 C45 100 36 90 32 72 C26 50 40 38 50 24 Z" style={{ fill: colors[0], transition: 'fill 3s ease-in-out', opacity: 0.5 }} />
      </svg>
      <span className="flame-level">{level}</span>
    </div>
  );
}

function isWordChar(ch) {
  return /[a-zA-ZÀ-ÿ0-9\u0600-\u06FF\u3040-\u30FF\u4E00-\u9FFF]/.test(ch);
}

function buildEssentialSet(lang1, lang2, name) {
  const words = ESSENTIAL_WORDS.map((w, i) => ({
    id: "ess_" + lang1 + "_" + lang2 + "_" + i,
    word: w[lang1] || w.en,
    translation: w[lang2] || w.en
  }));
  return {
    id: "essential_" + lang1 + "_" + lang2,
    name: name,
    lang1: lang1,
    lang2: lang2,
    words: words,
    isEssential: true
  };
}

function FlashcardsGame({ set, savedIds, onToggleSaved, onFinish, onExit, voiceSettings, onReview, onGameComplete }) {
  const { t } = useI18n();
  const { speakText, speaking } = useSpeech(voiceSettings.rate, voiceSettings.pitch);
  const initialCards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);
  const isSanctuary = set.id === "saved";
  const cards = useMemo(() => isSanctuary ? initialCards : initialCards.filter(w => !savedIds.includes(w.id)), [initialCards, savedIds, isSanctuary]);
  const [idx, setIdx] = useState(0);
  const [showTranslation, setShowTranslation] = useState(false);
  const [results, setResults] = useState([]);
  const [isAnswering, setIsAnswering] = useState(false);
  const [swipeX, setSwipeX] = useState(0);
  const swipeStartRef = useRef(null);
  const suppressCardClickRef = useRef(false);
  const card = cards[idx];
  useEffect(() => {
    if (idx >= cards.length) {
      if (cards.length === 0) { if (onGameComplete) onGameComplete(); onFinish(results, initialCards); }
      else { setIdx(cards.length - 1); }
    }
  }, [cards.length, idx]);
  useEffect(() => { setShowTranslation(false); setIsAnswering(false); setSwipeX(0); swipeStartRef.current = null; }, [idx]);
  const cardLang1 = card?.lang1 || set.lang1;
  const cardLang2 = card?.lang2 || set.lang2;
  const speakFront = useCallback(() => { if (card) speakText(card.word, cardLang1); }, [card, cardLang1, speakText]);
  const speakBack = useCallback(() => { if (card) speakText(card.translation, cardLang2); }, [card, cardLang2, speakText]);
  const handleCardClick = () => { if (isAnswering) return; setShowTranslation(prev => !prev); };
  const speakCurrent = () => { if (showTranslation) speakBack(); else speakFront(); };
  if (!card) return (<div className="glass results-box"><p>{t("noWords")}</p><button type="button" className="btn btn-primary" onClick={onExit}>{t("home")}</button></div>);
  const l1 = getLang(cardLang1);
  const l2 = getLang(cardLang2);
  const answer = (ok) => {
    if (isAnswering) return;
    setIsAnswering(true);
    if (onReview) onReview(ok);
    const newResults = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
    setResults(newResults);
    setTimeout(() => {
      if (idx + 1 >= cards.length) { if (onGameComplete) onGameComplete(); onFinish(newResults, initialCards); }
      else { setIdx(idx + 1); }
      setIsAnswering(false);
    }, 400);
  };
  const handleCardPointerDown = (e) => {
    if (isAnswering || (e.pointerType === "mouse" && e.button !== 0)) return;
    swipeStartRef.current = { x: e.clientX, y: e.clientY };
    e.currentTarget.setPointerCapture?.(e.pointerId);
  };
  const handleCardPointerMove = (e) => {
    if (!swipeStartRef.current || isAnswering) return;
    const dx = e.clientX - swipeStartRef.current.x;
    const dy = e.clientY - swipeStartRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
      e.preventDefault();
      setSwipeX(Math.max(-180, Math.min(180, dx)));
    }
  };
  const handleCardPointerUp = (e) => {
    if (!swipeStartRef.current || isAnswering) return;
    const dx = e.clientX - swipeStartRef.current.x;
    const dy = e.clientY - swipeStartRef.current.y;
    swipeStartRef.current = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)) {
      suppressCardClickRef.current = true;
      setSwipeX(dx > 0 ? 500 : -500);
      answer(dx > 0);
      window.setTimeout(() => { suppressCardClickRef.current = false; }, 450);
    } else if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
      suppressCardClickRef.current = true;
      setSwipeX(0);
      window.setTimeout(() => { suppressCardClickRef.current = false; }, 250);
    } else {
      setSwipeX(0);
    }
  };
  const handleCardKeyDown = (e) => {
    if ((e.key === "Enter" || e.key === " ") && !isAnswering) {
      e.preventDefault();
      handleCardClick();
    }
  };
  const isSaved = savedIds.includes(card.id);
  const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;
  return (
    <div className="flashcard-game game-shell">
      <div className="game-header">
        <button type="button" className="icon-btn" onClick={onExit} aria-label={t("back")}><CloseIcon /></button>
        <div style={{ textAlign: "center", flex: 1 }}>
          <div className="game-title">{set.name}</div>
          <div className="game-subtitle">{t("card")} {idx + 1} {t("of")} {cards.length}</div>
        </div>
        <button type="button" className="icon-btn" onClick={() => answer(false)} aria-label="Skip"><SkipIcon /></button>
      </div>
      <div className="progress-bar"><div className="progress-fill" style={{ width: progress + "%" }} /></div>
      <div className="dual-card-container single-card-mode">
        <div
          className={`dual-card ${showTranslation ? 'dual-card-arabic' : 'dual-card-french'}`}
          role="button"
          tabIndex={0}
          aria-label={`${t("tapToFlip")}. ${t("correct")} إلى اليمين، ${t("wrong")} إلى اليسار`}
          onClick={() => { if (!suppressCardClickRef.current) handleCardClick(); }}
          onKeyDown={handleCardKeyDown}
          onPointerDown={handleCardPointerDown}
          onPointerMove={handleCardPointerMove}
          onPointerUp={handleCardPointerUp}
          onPointerCancel={() => { swipeStartRef.current = null; setSwipeX(0); }}
          style={swipeX ? { transform: `translate3d(${swipeX}px, 0, 0) rotate(${swipeX / 18}deg)`, transition: "none" } : undefined}
        >
          <span className={`swipe-label right ${swipeX > 30 ? "visible" : ""}`}>✓ {t("correct")}</span>
          <span className={`swipe-label left ${swipeX < -30 ? "visible" : ""}`}>× {t("wrong")}</span>
          <div className="card-top-actions">
            <button type="button" className="card-round-btn" onPointerDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onToggleSaved(card.id); }}>
              <BookmarkIcon filled={isSaved} />
            </button>
            <span className="card-chip">{idx + 1}/{cards.length}</span>
            <button type="button" className="card-round-btn" onPointerDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); speakCurrent(); }} style={{ backgroundColor: speaking ? 'rgba(139,92,246,0.5)' : '' }}>
              <SpeakerIcon active={speaking} />
            </button>
          </div>
          <div className="card-lang-label">{showTranslation ? `${l2.flag} ${l2.name}` : `${l1.flag} ${l1.name}`}</div>
          <div className={showTranslation ? "card-translation" : "card-word"} dir={showTranslation ? l2.dir : l1.dir}>
            {showTranslation ? card.translation : card.word}
          </div>
          <div className="card-hint">✨ {t("tapToFlip")}</div>
        </div>
      </div>
      <div className="card-dots">
        {cards.slice(0, Math.min(cards.length, 30)).map((c, i) => (
          <div key={c.id} className={`card-dot ${i < idx ? (results[i]?.correct ? 'correct' : 'wrong') : ''} ${i === idx ? 'current' : ''}`} />
        ))}
      </div>
      <div className="answer-buttons">
        <button type="button" className="btn btn-danger btn-lg" onClick={() => answer(false)} disabled={isAnswering}>
          <CrossIcon size={16} color="white" /> {t("wrong")}
        </button>
        <button type="button" className="btn btn-success btn-lg" onClick={() => answer(true)} disabled={isAnswering}>
          <CheckIcon size={16} color="white" /> {t("correct")}
        </button>
      </div>
    </div>
  );
}

function MCQGame({ set, savedIds, onToggleSaved, onFinish, onExit, voiceSettings, onReview, onGameComplete }) {
  const { t } = useI18n();
  const { speakText } = useSpeech(voiceSettings.rate, voiceSettings.pitch);
  const initialCards = useMemo(() => shuffle(set.words), [set.id, set.words.length]);
  const isSanctuary = set.id === "saved";
  const cards = useMemo(() => isSanctuary ? initialCards : initialCards.filter(w => !savedIds.includes(w.id)), [initialCards, savedIds, isSanctuary]);
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [options, setOptions] = useState([]);
  const [results, setResults] = useState([]);
  const card = cards[idx];
  useEffect(() => {
    if (idx >= cards.length) {
      if (cards.length === 0) { if (onGameComplete) onGameComplete(); onFinish(results, initialCards); }
      else { setIdx(cards.length - 1); }
    }
  }, [cards.length, idx]);
  useEffect(() => {
    if (!card) return;
    const others = set.words.filter(w => w.id !== card.id && !savedIds.includes(w.id)).map(w => w.translation).sort(() => Math.random() - 0.5).slice(0, 3);
    setOptions(shuffle([card.translation, ...others]));
    setSelected(null);
  }, [idx, card?.id, savedIds]);
  if (!card) return (<div className="glass results-box"><p>{t("noWords")}</p><button type="button" className="btn btn-primary" onClick={onExit}>{t("home")}</button></div>);
  const choose = (opt) => {
    if (selected !== null) return;
    const ok = opt === card.translation;
    setSelected(opt);
    if (onReview) onReview(ok);
    const res = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
    setResults(res);
    setTimeout(() => {
      if (idx + 1 >= cards.length) { if (onGameComplete) onGameComplete(); onFinish(res, initialCards); }
      else { setIdx(idx + 1); }
    }, 1100);
  };
  const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;
  const isSaved = savedIds.includes(card.id);
  return (
    <div className="mcq-game game-shell">
      <div className="game-header">
        <button type="button" className="icon-btn" onClick={onExit} aria-label={t("back")}><CloseIcon /></button>
        <div style={{ textAlign: "center", flex: 1 }}>
          <div className="game-title"><GamepadIcon size={20} color="#8B5CF6" /> {set.name}</div>
          <div className="game-subtitle">{t("question")} {idx + 1} {t("of")} {cards.length}</div>
        </div>
      </div>
      <div className="progress-bar"><div className="progress-fill" style={{ width: progress + "%" }} /></div>
      <div className="mcq-word-box glass" style={{position: 'relative'}}>
        <div style={{position: 'absolute', top: 12, left: 12, right: 12, display: 'flex', justifyContent: 'space-between', zIndex: 5}}>
          <button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); onToggleSaved(card.id); }}><BookmarkIcon filled={isSaved} /></button>
          <button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); speakText(card.word, set.lang1); }}><SpeakerIcon /></button>
        </div>
        <div style={{paddingTop: 30}}>{card.word}</div>
      </div>
      <div className="mcq-options">
        {options.map((opt, i) => {
          let cls = "mcq-option";
          if (selected !== null) {
            if (opt === card.translation) cls += " correct";
            else if (opt === selected) cls += " wrong";
          }
          return (<button type="button" key={i} className={cls} disabled={selected !== null} onClick={() => choose(opt)}>{opt}</button>);
        })}
      </div>
    </div>
  );
}

      if (cards.length === 0) { if (onGameComplete) onGameComplete(); onFinish(results, initialCards); }

    }
  }, [cards.length, idx]);
  useEffect(() => { setVal(""); setMsg(null); }, [idx, card?.id]);
  if (!card) return (<div className="glass results-box"><p>{t("noWords")}</p><button type="button" className="btn btn-primary" onClick={onExit}>{t("home")}</button></div>);
  const submit = () => {
    if (!card || msg) return;
    const ok = val.trim().toLowerCase() === card.word.toLowerCase();
    setMsg(ok ? "correct" : "wrong");
    if (onReview) onReview(ok);
    const res = [...results, { id: card.id, correct: ok, word: card.word, translation: card.translation }];
    setResults(res);
    setTimeout(() => {
      if (idx + 1 >= cards.length) { if (onGameComplete) onGameComplete(); onFinish(res, initialCards); }
      else { setIdx(idx + 1); }
    }, 1500);
  };
  const progress = cards.length ? ((idx + 1) / cards.length) * 100 : 0;
  const l2 = getLang(set.lang2);
  const isSaved = savedIds.includes(card.id);
  return (
    <div className="spelling-game game-shell">
      <div className="game-header">
        <button type="button" className="icon-btn" onClick={onExit} aria-label={t("back")}><CloseIcon /></button>
        <div style={{ textAlign: "center", flex: 1 }}>
          <div className="game-title"><BookIcon size={20} color="#8B5CF6" /> {set.name}</div>
          <div className="game-subtitle">{t("question")} {idx + 1} {t("of")} {cards.length}</div>
        </div>
      </div>
      <div className="progress-bar"><div className="progress-fill" style={{ width: progress + "%" }} /></div>
      <div className="spelling-box glass" style={{position: 'relative'}}>
        <div style={{position: 'absolute', top: 12, left: 12, right: 12, display: 'flex', justifyContent: 'space-between', zIndex: 5}}>
          <button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); onToggleSaved(card.id); }}><BookmarkIcon filled={isSaved} /></button>
          <button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); speakText(card.translation, set.lang2); }}><SpeakerIcon /></button>
        </div>
        <div style={{marginTop: 30, fontSize: 13, color: "var(--text-light)", fontWeight: 600}}>{l2.flag} {t("listenWrite")}</div>
        <div className="spelling-translation" dir={l2.dir}>{card.translation}</div>
      </div>
      <input className={`spelling-input ${msg || ""}`} value={val} onChange={e => setVal(e.target.value)} onKeyDown={e => { if (e.key === "Enter") submit(); }} placeholder={t("typeWord")} disabled={!!msg} autoFocus />
      {msg === "wrong" && (<div style={{ textAlign: "center", color: "var(--danger)", fontWeight: 700, marginBottom: 14, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}><CrossIcon size={16} color="#EF4444" /> {card.word}</div>)}
      {msg === "correct" && (<div style={{ textAlign: "center", color: "var(--success)", fontWeight: 700, marginBottom: 14, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}><CheckIcon size={16} color="#10B981" /></div>)}
      <button type="button" className="btn btn-primary btn-block btn-lg" onClick={submit} disabled={!val.trim() || !!msg}>{t("check")}</button>
    </div>
  );
}

function MatchingGame({ set, savedIds, onToggleSaved, onFinish, onExit, onReview, onGameComplete }) {
  const { t } = useI18n();
  const { speakText } = useSpeech(0.9, 1.0);
  const isSanctuary = set.id === "saved";
  const initialPairs = useMemo(() => shuffle(set.words).slice(0, 6), [set.id, set.words.length]);
  const pairs = useMemo(() => isSanctuary ? initialPairs : initialPairs.filter(w => !savedIds.includes(w.id)), [initialPairs, savedIds, isSanctuary]);
  const [leftWords] = useState(() => shuffle(initialPairs));
  const [rightTrans] = useState(() => shuffle(initialPairs));
  const [selA, setSelA] = useState(null);
  const [selB, setSelB] = useState(null);
  const [permanentMatchedIds, setPermanentMatchedIds] = useState([]);
  const [greenFlashIds, setGreenFlashIds] = useState([]);
  const [wrongFlashIds, setWrongFlashIds] = useState([]);
  const [results, setResults] = useState([]);
  useEffect(() => {
    if (!selA || !selB) return;
    const ok = selA.id === selB.id;
    if (onReview) onReview(ok);
    const res = [...results, { id: selA.id, correct: ok, word: selA.word, translation: selA.translation }];
    setResults(res);
    if (ok) {
      setGreenFlashIds([selA.id]);
      const newPermanent = [...permanentMatchedIds, selA.id];
      setTimeout(() => {
        setPermanentMatchedIds(newPermanent);
        setGreenFlashIds([]);
        setSelA(null); setSelB(null);
        if (newPermanent.length >= pairs.length) { if (onGameComplete) onGameComplete(); onFinish(res, initialPairs); }
      }, 1000);
    } else {
      setWrongFlashIds([selA.id, selB.id]);
      setTimeout(() => { setWrongFlashIds([]); setSelA(null); setSelB(null); }, 1000);
    }
  }, [selA, selB, pairs.length, permanentMatchedIds, results, initialPairs, onReview, onFinish, onGameComplete]);
  if (pairs.length < 2) return (<div className="glass results-box"><p>{t("noWords")}</p><button type="button" className="btn btn-primary" onClick={onExit}>{t("home")}</button></div>);
  const l1 = getLang(set.lang1);
  const l2 = getLang(set.lang2);
  const leftFiltered = leftWords.filter(i => !permanentMatchedIds.includes(i.id) && !savedIds.includes(i.id));
  const rightFiltered = rightTrans.filter(i => !permanentMatchedIds.includes(i.id) && !savedIds.includes(i.id));
  return (
    <div className="matching-game game-shell">
      <div className="game-header">
        <button type="button" className="icon-btn" onClick={onExit} aria-label={t("back")}><CloseIcon /></button>
        <div style={{ textAlign: "center", flex: 1 }}>
          <div className="game-title"><CrossIcon size={20} color="#8B5CF6" /> {set.name}</div>
          <div className="game-subtitle">{permanentMatchedIds.length}/{pairs.length} {t("matchPairs")}</div>
        </div>
      </div>
      <div className="match-game-layout" dir="ltr">
        <div className="match-column-section">
          <div className="match-column-header">{l2.name}</div>
          <div className="match-column">
            {rightFiltered.map(item => {
              const isSelected = selB?.id === item.id;
              const isGreen = greenFlashIds.includes(item.id);
              const isWrong = wrongFlashIds.includes(item.id);
              return (
                <div key={item.id} className={`match-btn ${isSelected ? "selected" : ""} ${isGreen ? "green-flash" : ""} ${isWrong ? "wrong-flash" : ""}`} role="button" tabIndex={0} aria-pressed={isSelected} onClick={() => { if (!selA || !selB) setSelB(item); }} onKeyDown={e => { if ((e.key === "Enter" || e.key === " ") && (!selA || !selB)) { e.preventDefault(); setSelB(item); } }}>
                  <div className="match-actions" onClick={(e) => e.stopPropagation()}>
                    <button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); onToggleSaved(item.id); }} aria-label="Save"><BookmarkIcon filled={savedIds.includes(item.id)} size={14} /></button>
                    <button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); speakText(item.translation, set.lang2); }} aria-label="Speak"><SpeakerIcon size={14} /></button>
                  </div>
                  <span className="match-text" dir={l2.dir}>{item.translation}</span>
                </div>
              );
            })}
          </div>
        </div>
        <div className="match-column-section">
          <div className="match-column-header">{l1.name}</div>
          <div className="match-column">
            {leftFiltered.map(item => {
              const isSelected = selA?.id === item.id;
              const isGreen = greenFlashIds.includes(item.id);
              const isWrong = wrongFlashIds.includes(item.id);
              return (
                <div key={item.id} className={`match-btn ${isSelected ? "selected" : ""} ${isGreen ? "green-flash" : ""} ${isWrong ? "wrong-flash" : ""}`} role="button" tabIndex={0} aria-pressed={isSelected} onClick={() => { if (!selA || !selB) setSelA(item); }} onKeyDown={e => { if ((e.key === "Enter" || e.key === " ") && (!selA || !selB)) { e.preventDefault(); setSelA(item); } }}>
                  <div className="match-actions" onClick={(e) => e.stopPropagation()}>
                    <button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); onToggleSaved(item.id); }} aria-label="Save"><BookmarkIcon filled={savedIds.includes(item.id)} size={14} /></button>
                    <button type="button" className="icon-btn" onClick={(e) => { e.stopPropagation(); speakText(item.word, set.lang1); }} aria-label="Speak"><SpeakerIcon size={14} /></button>
                  </div>
                  <span className="match-text" dir={l1.dir}>{item.word}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function SentenceGame({ set, savedIds, onToggleSaved, onFinish, onExit, voiceSettings, onReview, onGameComplete }) {
  const { t, locale } = useI18n();
  const { speakText } = useSpeech(voiceSettings.rate, voiceSettings.pitch);
  const [selectedWord, setSelectedWord] = useState(null);
  const [sentence, setSentence] = useState("");
  const [explanation, setExplanation] = useState("");
  const [loading, setLoading] = useState(false);
  const [pickerOpen, setPickerOpen] = useState(false);
  const words = set.words;
  const generateSentenceLocal = useCallback((word, lang) => {
    const templates = {
      ar: [`اليوم قلت "${word}" لصديقتي لأنها ساعدتني كثيراً.`, `في المدرسة، تعلمنا كلمة "${word}" واستخدمناها في جملة.`, `أحب أن أقول "${word}" عندما أكون ممتناً لشخص ما.`, `كتبت في دفتر الملاحظات: "${word}" هي كلمة مهمة جداً.`, `قال المعلم: "من فضلك استخدم "${word}" في جملة مفيدة."`],
      en: [`Today I said "${word}" to my friend because she helped me a lot.`, `At school, we learned the word "${word}" and used it in a sentence.`, `I like to say "${word}" when I am grateful to someone.`, `I wrote in my notebook: "${word}" is a very important word.`, `The teacher said, "Please use "${word}" in a useful sentence."`],
      fr: [`Aujourd'hui, j'ai dit « ${word} » à mon amie parce qu'elle m'a beaucoup aidé.`, `À l'école, nous avons appris le mot « ${word} » et l'avons utilisé dans une phrase.`, `J'aime dire « ${word} » quand je suis reconnaissant envers quelqu'un.`, `J'ai écrit dans mon cahier : « ${word} » est un mot très important.`, `Le professeur a dit : « Veuillez utiliser « ${word} » dans une phrase utile. »`],
      es: [`Hoy dije "${word}" a mi amiga porque me ayudó mucho.`, `En la escuela, aprendimos la palabra "${word}" y la usamos en una oración.`, `Me gusta decir "${word}" cuando estoy agradecido con alguien.`],
      de: [`Heute habe ich "${word}" zu meiner Freundin gesagt, weil sie mir sehr geholfen hat.`, `In der Schule haben wir das Wort "${word}" gelernt und in einem Satz verwendet.`, `Ich sage gerne "${word}", wenn ich jemandem dankbar bin.`],
      pt: [`Hoje eu disse "${word}" para minha amiga porque ela me ajudou muito.`, `Na escola, aprendemos a palavra "${word}" e a usamos em uma frase.`],
      ja: [`今日、友達が助けてくれたので「${word}」と言いました。`, `学校で「${word}」という言葉を学び、文で使いました。`]
    };
    const langTemplates = templates[lang] || templates.en;
    return langTemplates[Math.floor(Math.random() * langTemplates.length)];
  }, []);
  const generateExplanationLocal = useCallback((word, translation, lang) => {
    const templates = {
      ar: `كلمة "${word}" تعني "${translation}" بالعربية. وهي من الكلمات الشائعة التي تستخدم في الحياة اليومية للتعبير عن معنى "${translation}".`,
      en: `The word "${word}" means "${translation}" in Arabic. It is a common word used in everyday life to express the meaning of "${translation}".`,
      fr: `Le mot « ${word} » signifie « ${translation} » en arabe. C'est un mot courant utilisé dans la vie quotidienne pour exprimer le sens de « ${translation} ».`,
      es: `La palabra "${word}" significa "${translation}" en árabe.`,
      de: `Das Wort "${word}" bedeutet "${translation}" auf Arabisch.`,
      pt: `A palavra "${word}" significa "${translation}" em árabe.`,
      ja: `「${word}」はアラビア語で「${translation}」を意味します。`
    };
    return templates[lang] || templates.en;
  }, []);
  const generateSentence = useCallback(async (word) => {
    const lang = set.lang1;
    const langName = getLang(lang).name;
    const prompt = `Create a logical, realistic, and natural daily life context sentence in ${langName} that includes the word "${word}". Return ONLY the sentence itself, without quotes or extra text.`;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    try {
      const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, { signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) throw new Error("bad");
      const text = await res.text();
      const clean = text.trim().split('\n')[0].trim();
      if (clean && clean.length > 2 && clean.length < 300) return clean;
    } catch (e) {} finally { clearTimeout(timeout); }
    return generateSentenceLocal(word, lang);
  }, [set.lang1, generateSentenceLocal]);
  const generateExplanation = useCallback(async (word, translation) => {
    const uiLang = locale;
    const uiLangName = getLang(uiLang).name;
    const langName = getLang(set.lang1).name;
    const prompt = `Explain the meaning, usage, and context of the ${langName} word "${word}" (which translates to "${translation}") in ${uiLangName}. Keep it concise and clear. Return ONLY the explanation text.`;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    try {
      const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, { signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) throw new Error("bad");
      const text = await res.text();
      const clean = text.trim().split('\n')[0].trim();
      if (clean && clean.length > 2) return clean;
    } catch (e) {} finally { clearTimeout(timeout); }
    return generateExplanationLocal(word, translation, uiLang);
  }, [locale, set.lang1, generateExplanationLocal]);
  const handleSelectWord = async (word) => {
    setSelectedWord(word);
    setPickerOpen(false);
    setLoading(true);
    try {
      const [sent, expl] = await Promise.all([generateSentence(word.word), generateExplanation(word.word, word.translation)]);
      setSentence(sent);
      setExplanation(expl);
    } catch (e) {
      setSentence(generateSentenceLocal(word.word, set.lang1));
      setExplanation(generateExplanationLocal(word.word, word.translation, locale));
    } finally {
      setLoading(false);
      if (onGameComplete) onGameComplete();
    }
  };
  const handleRegenerate = async () => {
    if (!selectedWord) return;
    setLoading(true);
    try {
      const [sent, expl] = await Promise.all([generateSentence(selectedWord.word), generateExplanation(selectedWord.word, selectedWord.translation)]);
      setSentence(sent);
      setExplanation(expl);
    } catch (e) {
      setSentence(generateSentenceLocal(selectedWord.word, set.lang1));
      setExplanation(generateExplanationLocal(selectedWord.word, selectedWord.translation, locale));
    } finally { setLoading(false); }
  };
  return (
    <div className="sentence-game game-shell">
      <div className="game-header">
        <button type="button" className="icon-btn" onClick={onExit} aria-label={t("back")}><CloseIcon /></button>
        <div style={{ textAlign: "center", flex: 1 }}>
          <div className="game-title"><SentenceIcon size={20} /> {set.name}</div>
          <div className="game-subtitle">{t("sentenceGame")}</div>
        </div>
      </div>
      {selectedWord ? (
        <div className="glass results-box sentence-result">
          <div style={{ marginBottom: 20 }}>
            <span className="card-chip" style={{ background: 'rgba(139,92,246,0.15)', color: 'var(--text)' }}>{selectedWord.word} → {selectedWord.translation}</span>
          </div>
          {loading ? (<div className="muted" style={{ margin: '20px 0' }}>⏳ {t("translating")}</div>) : (
            <>
              <div style={{ background: 'rgba(139,92,246,0.05)', padding: 16, borderRadius: 14, marginBottom: 16, textAlign: 'start', borderLeft: '4px solid var(--primary)' }}>
                <div style={{fontSize: 12, fontWeight: 800, color: 'var(--primary)', marginBottom: 8, textTransform: 'uppercase'}}>📖 {t("context")}</div>
                <div style={{fontSize: 18, fontWeight: 700, lineHeight: 1.6}}>{sentence}</div>
              </div>
              <div style={{ background: 'rgba(16,185,129,0.05)', padding: 16, borderRadius: 14, marginBottom: 16, textAlign: 'start', borderLeft: '4px solid var(--success)' }}>
                <div style={{fontSize: 12, fontWeight: 800, color: 'var(--success)', marginBottom: 8, textTransform: 'uppercase'}}>💡 {t("explanation")}</div>
                <div style={{fontSize: 15, fontWeight: 600, lineHeight: 1.6}}>{explanation}</div>
              </div>
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' }}>
                <button type="button" className="btn btn-primary" onClick={() => speakText(sentence, set.lang1)}><SpeakerIcon /> {t("dicteeListenAgain")}</button>
                <button type="button" className="btn btn-secondary" onClick={handleRegenerate}>🔄 {t("retry")}</button>
                <button type="button" className="btn btn-secondary" onClick={() => setPickerOpen(true)}><BookIcon size={16} /> {t("word")}</button>
              </div>
            </>
          )}
        </div>
      ) : (
        <div className="glass results-box sentence-empty" style={{ textAlign: 'center' }}>
          <p style={{ marginBottom: 20, fontWeight: 700, fontSize: 18 }}>✨ {t("sentenceGame")}</p>
          <button type="button" className="btn btn-primary btn-lg" onClick={() => setPickerOpen(true)}><BookIcon size={18} /> {t("word")}</button>
        </div>
      )}
      {pickerOpen && (
        <div className="modal-overlay" onClick={() => setPickerOpen(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>{t("word")}</h3>
            <div style={{ maxHeight: '60vh', overflowY: 'auto' }}>
              {words.length === 0 ? (
                <div className="empty-state"><div className="empty-icon"><BookIcon size={48} color="#8B5CF6" /></div><div className="empty-text">{t("noWords")}</div></div>
              ) : (
                words.map(w => (
                  <div key={w.id} className="word-row" style={{ cursor: 'pointer' }} onClick={() => handleSelectWord(w)}>
                    <div className="word-row-main">
                      <div className="word-row-text">{w.word}</div>
                      <div className="word-row-translation">→ {w.translation}</div>
                    </div>
                  </div>
                ))
              )}
            </div>
            <div className="modal-actions"><button type="button" className="btn btn-secondary" onClick={() => setPickerOpen(false)}>{t("cancel")}</button></div>
          </div>
        </div>
      )}
    </div>
  );
}
