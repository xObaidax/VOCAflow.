function DicteeGame({ onExit, onGameComplete }) {
  const { t, locale } = useI18n();
  const { speakText } = useSpeech(1, 1);
  const [state, setState] = useState("level_select");
  const [level, setLevel] = useState(null);
  const [session, setSession] = useState([]);
  const [idx, setIdx] = useState(0);
  const [userInput, setUserInput] = useState("");
  const [diffResult, setDiffResult] = useState(null);
  const [results, setResults] = useState([]);
  const [showHint, setShowHint] = useState(false);
  const [playerStatus, setPlayerStatus] = useState("idle");
  const [audioTime, setAudioTime] = useState(0);
  const [audioDuration, setAudioDuration] = useState(0);
  const [playbackRate, setPlaybackRate] = useState(1);
  const audioRef = useRef(null);
  const speechRunRef = useRef(0);
  const pendingSeekRef = useRef(null);

  const levels = ["A1", "A2", "B1", "B2", "C1", "C2"];
  const levelLabels = [t("dicteeLevel1"), t("dicteeLevel2"), t("dicteeLevel3"), t("dicteeLevel4"), t("dicteeLevel5"), t("dicteeLevel6")];
  const currentText = session[idx] || "";

  const hintText = useMemo(() => {
    if (!currentText) return "";
    return currentText.split(/\s+/).map(w => {
      let shown = false;
      return w.split("").map(ch => {
        if (isWordChar(ch)) {
          if (!shown) { shown = true; return ch; }
          return "•";
        }
        return ch;
      }).join("");
    }).join(" ");
  }, [currentText]);

  const wordCount = useMemo(() => currentText.split(/\s+/).filter(Boolean).length, [currentText]);
  const formatTime = seconds => {
    const safe = Math.max(0, Math.round(seconds));
    return `${Math.floor(safe / 60)}:${String(safe % 60).padStart(2, "0")}`;
  };

  const stopPlayer = useCallback((nextStatus = "paused") => {
    speechRunRef.current += 1;
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current.currentTime = audioRef.current.currentTime || 0;
    }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setPlayerStatus(nextStatus);
  }, []);

  const createAudio = useCallback(() => {
    if (!currentText) return null;
    if (audioRef.current && audioRef.current.dataset.text === currentText) return audioRef.current;
    if (audioRef.current) audioRef.current.pause();
    const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=fr&client=tw-ob&q=${encodeURIComponent(currentText)}`);
    audio.dataset.text = currentText;
    audio.preload = "auto";
    audio.playbackRate = playbackRate;
    audio.onloadedmetadata = () => {
      setAudioDuration(Number.isFinite(audio.duration) ? audio.duration : Math.max(3, currentText.split(/\s+/).length * 0.55));
      if (pendingSeekRef.current !== null) {
        audio.currentTime = Math.max(0, Math.min(audio.duration || 0, pendingSeekRef.current));
        pendingSeekRef.current = null;
        setAudioTime(audio.currentTime);
      }
    };
    audio.ontimeupdate = () => setAudioTime(audio.currentTime || 0);
    audio.onplay = () => setPlayerStatus("playing");
    audio.onpause = () => { if (!audio.ended) setPlayerStatus("paused"); };
    audio.onended = () => { setAudioTime(audio.duration || audioTime); setPlayerStatus("ended"); };
    audio.onerror = () => {
      audioRef.current = null;
      if (window.speechSynthesis) {
        const runId = ++speechRunRef.current;
        const utterance = new SpeechSynthesisUtterance(currentText);
        utterance.lang = "fr-FR";
        utterance.rate = playbackRate;
        utterance.pitch = 1;
        utterance.onstart = () => setPlayerStatus("playing");
        utterance.onend = () => { if (runId === speechRunRef.current) setPlayerStatus("ended"); };
        utterance.onerror = () => { if (runId === speechRunRef.current) setPlayerStatus("paused"); };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      } else {
        speakText(currentText, "fr", { rate: playbackRate });
      }
    };
    audioRef.current = audio;
    return audio;
  }, [audioTime, currentText, playbackRate, speakText]);

  const playSentence = useCallback(() => {
    const audio = createAudio();
    if (!audio) return;
    audio.playbackRate = playbackRate;
    audio.play().catch(() => {
      if (audio.onerror) audio.onerror();
    });
  }, [createAudio, playbackRate]);

  const togglePlayer = () => {
    const audio = audioRef.current;
    if (audio && playerStatus === "playing") {
      audio.pause();
      return;
    }
    if (audio && playerStatus === "paused") {
      audio.play().catch(() => {});
      return;
    }
    if (audio && playerStatus === "ended") audio.currentTime = 0;
    playSentence();
  };

  const seekBySeconds = seconds => {
    const audio = createAudio();
    if (!audio) return;
    const knownDuration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : audioDuration;
    const target = Math.max(0, Math.min(knownDuration || 999, (audio.currentTime || audioTime) + seconds));
    if (knownDuration) {
      audio.currentTime = target;
      setAudioTime(target);
    } else {
      pendingSeekRef.current = target;
    }
  };

  const handleTimelineChange = e => {
    const target = Number(e.target.value);
    const audio = createAudio();
    if (!audio) return;
    if (Number.isFinite(audio.duration) && audio.duration > 0) audio.currentTime = target;
    else pendingSeekRef.current = target;
    setAudioTime(target);
  };

  const handleRateChange = e => {
    const nextRate = Number(e.target.value);
    setPlaybackRate(nextRate);
    if (audioRef.current) audioRef.current.playbackRate = nextRate;
  };

  useEffect(() => {
    setShowHint(false);
    speechRunRef.current += 1;
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current = null;
    }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    pendingSeekRef.current = null;
    setAudioTime(0);
    setAudioDuration(0);
    setPlayerStatus("idle");
  }, [idx, currentText]);

  useEffect(() => () => {
    speechRunRef.current += 1;
    if (audioRef.current) audioRef.current.pause();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }, []);

  const startLevel = (l) => {
    const bank = DICTEE_BANK[l] || [];
    const shuffled = shuffle(bank).slice(0, Math.min(15, bank.length));
    setSession(shuffled);
    setLevel(l);
    setIdx(0);
    setUserInput("");
    setDiffResult(null);
    setResults([]);
    setState("playing");
    if (onGameComplete) onGameComplete();
  };

  const handleCorriger = () => {
    if (!currentText || !userInput.trim()) return;
    const res = getDiffResult(userInput, currentText);
    setDiffResult(res);
    setState("corrected");
    setResults(prev => [...prev, { text: currentText, ...res }]);
  };

  const chooseDictation = nextIndex => {
    const safeIndex = Math.max(0, Math.min(session.length - 1, nextIndex));
    setIdx(safeIndex);
    setUserInput("");
    setDiffResult(null);
    setState("playing");
  };

  const handleNext = () => {
    if (idx + 1 >= session.length) {
      setState("finished");
    } else {
      chooseDictation(idx + 1);
    }
  };

  if (state === "level_select") {
    return (
      <div className="dictee-game game-shell">
        <div className="game-header">
          <button type="button" className="icon-btn" onClick={onExit} aria-label={t("back")}><CloseIcon /></button>
          <div style={{ textAlign: "center", flex: 1 }}>
            <div className="game-title">🎧 {t("dicteeTitle")}</div>
            <div className="game-subtitle">{t("dicteeSubtitle")}</div>
          </div>
        </div>
        <div className="dictee-info-card">🎯 {t("dicteeDesc")}</div>
        <div className="dictee-level-grid">
          {levels.map((l, i) => (
            <button key={l} className="dictee-level-btn" onClick={() => startLevel(l)}>
              <span style={{ display: "block", fontSize: 22, fontWeight: 900 }}>{l}</span>
              <span style={{ display: "block", fontSize: 10, fontWeight: 700, color: "var(--text-light)", marginTop: 4 }}>{levelLabels[i]}</span>
            </button>
          ))}
        </div>
      </div>
    );
  }

  if (state === "finished") {
    const totalCorrect = results.reduce((a, b) => a + b.correctCount, 0);
    const totalWords = results.reduce((a, b) => a + b.totalWords, 0);
    const pct = totalWords ? Math.round((totalCorrect / totalWords) * 100) : 0;
    const missingErrors = results.reduce((a, b) => a + b.correctTokens.filter(tk => tk.status === 'missing').length, 0);
    const extraErrors = results.reduce((a, b) => a + b.userTokens.filter(tk => tk.status === 'extra').length, 0);
    const wrongErrors = results.reduce((a, b) => a + b.userTokens.filter(tk => tk.status === 'wrong').length, 0);
    let emoji = "💪";
    let msg = t("dicteeContinue");
    if (pct >= 90) { emoji = "🏆"; msg = t("dicteeExcellentMsg"); }
    else if (pct >= 75) { emoji = "🌟"; msg = t("dicteeVeryGoodMsg"); }
    else if (pct >= 50) { emoji = "👍"; msg = t("dicteeGoodMsg"); }
    return (
      <div className="dictee-game game-shell results-box glass">
        <div className="results-emoji"><LearningEmoji emoji={emoji} /></div>
        <h2 style={{ fontSize: 26, fontWeight: 900, marginBottom: 8 }}>{t("dicteeFinished")}</h2>
        <div className="score-circle">{pct}%</div>
        <div className="muted">{t("dicteeFinalScore")} : <strong style={{ color: "var(--primary)" }}>{totalCorrect} / {totalWords}</strong> {t("words")}</div>
        <div className="results-message">{msg}</div>
        <div className="dictee-final-stats">
          <div className="dictee-stat-card"><div className="dictee-stat-value">{results.length}</div><div className="dictee-stat-label">{t("dicteeDictations")}</div></div>
          <div className="dictee-stat-card"><div className="dictee-stat-value">{pct}%</div><div className="dictee-stat-label">{t("accuracy")}</div></div>
        </div>
        <div className="wrong-words-section">
          <div className="wrong-words-title">📊 {t("dicteeErrorAnalysis")}</div>
          <div className="word-row"><span>{t("dicteeMissingWords")}</span><strong>{missingErrors}</strong></div>
          <div className="word-row"><span>{t("dicteeExtraWords")}</span><strong>{extraErrors}</strong></div>
          <div className="word-row"><span>{t("dicteeSpellingErrors")}</span><strong>{wrongErrors}</strong></div>
        </div>
        <button type="button" className="btn btn-primary btn-block btn-lg" onClick={() => setState("level_select")}>🔄 {t("dicteeChooseAnotherLevel")}</button>
        <button type="button" className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={onExit}>🏠 {t("home")}</button>
      </div>
    );
  }

  const progressPct = state === "corrected"
    ? ((idx + 1) / Math.max(1, session.length)) * 100
    : (idx / Math.max(1, session.length)) * 100;

  return (
    <div className="dictee-game game-shell" dir={locale === "ar" ? "rtl" : "ltr"}>
      <div className="game-header">
        <button type="button" className="icon-btn" onClick={onExit} aria-label={t("back")}><CloseIcon /></button>
        <div style={{ textAlign: "center", flex: 1 }}>
          <div className="game-title">🎧 {t("dicteeTitle")} {level}</div>
          <div className="game-subtitle">{idx + 1} / {session.length}</div>
        </div>
        <div className="dictee-navigation">
          <button type="button" className="icon-btn" onClick={() => chooseDictation(idx - 1)} disabled={idx === 0} aria-label="الإملاء السابق">‹</button>
          <select value={idx} onChange={e => chooseDictation(Number(e.target.value))} aria-label="اختيار الإملاء">
            {session.map((_, i) => <option key={i} value={i}>#{i + 1}</option>)}
          </select>
          <button type="button" className="icon-btn" onClick={() => chooseDictation(idx + 1)} disabled={idx >= session.length - 1} aria-label="الإملاء التالي">›</button>
        </div>
      </div>

      <div className="progress-bar"><div className="progress-fill" style={{ width: progressPct + "%" }} /></div>

      <div className="dictee-pro-player glass" dir="ltr">
        <div className="dictee-audio-info">
          <span className="dictee-badge">🎧 {playerStatus === "playing" ? t("dicteePlaying") : playerStatus === "paused" ? t("dicteePaused") : t("dicteeReady")}</span>
          <span className="dictee-badge live">📝 {wordCount} {t("words")}</span>
        </div>
        <div className="dictee-player-timeline">
          <span>{formatTime(audioTime)}</span>
          <input
            className="dictee-scrubber"
            type="range"
            min="0"
            max={Math.max(1, audioDuration)}
            step="0.1"
            value={Math.min(audioTime, audioDuration || 1)}
            onChange={handleTimelineChange}
            aria-label={t("dicteeReplay")}
          />
          <span>{formatTime(audioDuration)}</span>
        </div>
        <div className="dictee-player-controls">
          <button type="button" className="icon-btn" onClick={() => seekBySeconds(-5)} aria-label="رجوع 5 ثوانٍ" title="رجوع 5 ثوانٍ">↶<small>5</small></button>
          <button type="button" className="play-main" onClick={togglePlayer} aria-label={t("dicteePlayPause")} title={t("dicteePlayPause")}>
            {playerStatus === "playing" ? "⏸" : "▶"}
          </button>
          <button type="button" className="icon-btn" onClick={() => seekBySeconds(5)} aria-label="تقديم 5 ثوانٍ" title="تقديم 5 ثوانٍ">↷<small>5</small></button>
        </div>
        <div className="dictee-speed-row">
          <span>⚙️ سرعة النطق</span>
          <select value={playbackRate} onChange={handleRateChange} aria-label="سرعة النطق">
            <option value="0.55">0.55×</option>
            <option value="0.7">0.70×</option>
            <option value="0.85">0.85×</option>
            <option value="1">1.00×</option>
            <option value="1.15">1.15×</option>
          </select>
        </div>
      </div>

      {state === "playing" && (
        <>
          <div className="dictee-toolbar">
            <button type="button" className="btn btn-secondary" onClick={() => setShowHint(h => !h)}>
              💡 {showHint ? t("dicteeHideHint") : t("dicteeShowHint")}
            </button>
            <button type="button" className="btn btn-secondary" onClick={() => setUserInput("")} disabled={!userInput}>
              🧹 {t("dicteeClear")}
            </button>
          </div>

          {showHint && (<div className="dictee-hint" dir="ltr">{hintText}</div>)}

          <textarea
            className="dictee-textarea"
            dir="ltr"
            value={userInput}
            onChange={e => setUserInput(e.target.value)}
            placeholder={t("dicteeWritePlaceholder")}
            autoFocus
          />
          <button type="button" className="btn btn-primary btn-block btn-lg" onClick={handleCorriger} disabled={!userInput.trim()}>
            ✅ {t("dicteeCorrect")}
          </button>
        </>
      )}

      {state === "corrected" && diffResult && (
        <div className="diff-result" dir="ltr">
          <div style={{ textAlign: "center", marginBottom: 16 }}>
            <span style={{ fontSize: 24, fontWeight: 900, color: "var(--primary)" }}>{diffResult.correctCount} / {diffResult.totalWords} {t("words")}</span>
          </div>
          <h4>{t("dicteeYourAnswer")}</h4>
          <div className="diff-text">
            {diffResult.userTokens.map((tok, i) => (<span key={i} className={`diff-word ${tok.status}`}>{tok.text}</span>))}
          </div>
          <h4>{t("dicteeCorrection")}</h4>
          <div className="diff-text">
            {diffResult.correctTokens.map((tok, i) => (<span key={i} className={`diff-word ${tok.status}`}>{tok.text}</span>))}
          </div>
          <button type="button" className="btn btn-success btn-block btn-lg" onClick={handleNext}>
            {idx + 1 >= session.length ? `${t("dicteeSeeResults")} 🏁` : `${t("dicteeNext")} ➡️`}
          </button>
        </div>
      )}
    </div>
  );
}

function Results({ results, onRetry, onRetryWrong, onHome }) {
  const { t } = useI18n();
  const total = results.length;
  const correct = results.filter(r => r.correct).length;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const wrong = results.filter(r => !r.correct);
  let label = t("tryAgain"), msg = t("msgTryAgain"), emoji = "💪";
  if (pct >= 90) { label = t("excellent"); msg = t("msgExcellent"); emoji = "🌟"; }
  else if (pct >= 70) { label = t("good"); msg = t("msgGood"); emoji = "👏"; }
  else if (pct >= 50) { label = t("fair"); msg = t("msgFair"); emoji = "👍"; }
  return (
    <div className="results-box glass">
      <div className="results-emoji"><LearningEmoji emoji={emoji} /></div>
      <h2 style={{ fontSize: 30, fontWeight: 900, marginBottom: 10 }}>{t("results")}</h2>
      <div className="score-circle">{pct}%</div>
      <div className="muted">{t("correctAnswers")}: <strong style={{ color: "var(--primary)", fontSize: 16 }}>{correct}/{total}</strong></div>
      <div style={{ margin: "16px 0", fontWeight: 800, fontSize: 19 }}>{label}</div>
      <div className="results-message">{msg}</div>
      {wrong.length > 0 && (
        <div className="wrong-words-section">
          <div className="wrong-words-title"><CrossIcon size={16} color="#EF4444" /> {t("wrongWords")}</div>
          {wrong.map((w, i) => (
            <div key={i} className="word-row">
              <div>
                <div className="word-row-text">{w.word}</div>
                <div className="word-row-translation">→ {w.translation}</div>
              </div>
            </div>
          ))}
        </div>
      )}
      <button type="button" className="btn btn-primary btn-block btn-lg" onClick={onRetry}>🔄 {t("retry")}</button>
      {wrong.length > 0 && (<button type="button" className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={onRetryWrong}>⭐ {t("retryWrong")}</button>)}
      <button type="button" className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={onHome}>🏠 {t("home")}</button>
    </div>
  );
}

function ActivityView({ usage, totalWords, stats }) {
  const { t } = useI18n();
  const [sheet, setSheet] = useState({ open: false, view: 'annual', month: null });
  const [selectedDayData, setSelectedDayData] = useState(null);
  const dailyActivity = stats.dailyActivity || {};
  const accuracy = stats.wordsReviewed > 0 ? Math.round((stats.correctAnswers / stats.wordsReviewed) * 100) : 0;
  let streak = 0;
  const todayDate = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(todayDate);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    if (dailyActivity[key] && (dailyActivity[key].reviewed > 0 || dailyActivity[key].added > 0)) { streak++; }
    else if (i > 0) { break; }
  }
  const weekDays = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    const dayData = dailyActivity[key] || {};
    weekDays.push({ label: d.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2), reviewed: dayData.reviewed || 0, added: dayData.added || 0, date: key });
  }
  const weekReviewedTotal = weekDays.reduce((a, b) => a + b.reviewed, 0);
  const weekAddedTotal = weekDays.reduce((a, b) => a + b.added, 0);
  const usageWeekMap = {};
  usage.weekDays.forEach(d => { usageWeekMap[d.date] = d.value; });
  const weekTimeTotal = weekDays.reduce((s, d) => s + (usageWeekMap[d.date] || 0), 0);
  const year = new Date().getFullYear();
  const monthNames = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sep', 'Oct', 'Nov', 'Déc'];
  const currentMonth = new Date().getMonth();
  const yearStr = String(year);
  const yearReviewed = Object.keys(dailyActivity).filter(k => k.startsWith(yearStr)).reduce((s, k) => s + (dailyActivity[k].reviewed || 0), 0);
  const yearAdded = Object.keys(dailyActivity).filter(k => k.startsWith(yearStr)).reduce((s, k) => s + (dailyActivity[k].added || 0), 0);
  const yearTime = Object.entries(usage.daily || {}).filter(([k]) => k.startsWith(yearStr)).reduce((s, [, v]) => s + (v || 0), 0);
  const getIntensity = (val) => { if (val === 0) return 0; if (val < 5) return 1; if (val < 15) return 2; return 3; };
  const renderAnnualView = () => (
    <div>
      <div className="year-summary-bar">
        <div className="summary-stat"><div className="summary-stat-icon"><BooksIcon size={24} /></div><div className="summary-stat-value">{yearReviewed}</div><div className="summary-stat-label">{t("reviewedWords")}</div></div>
        <div className="summary-stat"><div className="summary-stat-icon"><PlusIcon size={18} /></div><div className="summary-stat-value">{yearAdded}</div><div className="summary-stat-label">{t("wordsAdded")}</div></div>
        <div className="summary-stat"><div className="summary-stat-icon"><ClockIcon size={22} /></div><div className="summary-stat-value">{usage.fmt(yearTime)}</div><div className="summary-stat-label">{t("totalTime")}</div></div>
        <div className="summary-stat"><div className="summary-stat-icon"><FlameSmallIcon size={24} /></div><div className="summary-stat-value">{streak}</div><div className="summary-stat-label">{t("daysStreak")}</div></div>
      </div>
      <div className="year-grid">
        {monthNames.map((name, i) => {
          let monthReviewed = 0, monthAdded = 0;
          const monthKey = `${year}-${String(i + 1).padStart(2, '0')}`;
          Object.keys(dailyActivity).forEach(dayKey => {
            if (dayKey.startsWith(monthKey)) { monthReviewed += dailyActivity[dayKey].reviewed || 0; monthAdded += dailyActivity[dayKey].added || 0; }
          });
          const isActive = monthReviewed > 0 || monthAdded > 0;
          const isCurrent = i === currentMonth;
          const weeks = [];
          const daysInMonth = new Date(year, i + 1, 0).getDate();
          for (let w = 0; w < 5; w++) {
            let weekTotal = 0;
            for (let d = w * 7 + 1; d <= Math.min((w + 1) * 7, daysInMonth); d++) {
              const dayKey = `${monthKey}-${String(d).padStart(2, '0')}`;
              const dd = dailyActivity[dayKey] || {};
              weekTotal += (dd.reviewed || 0) + (dd.added || 0);
            }
            weeks.push(weekTotal);
          }
          const maxWeek = Math.max(1, ...weeks);
          return (
            <div key={i} className={`month-card ${isCurrent ? 'current' : ''} ${!isActive ? 'inactive' : ''}`} onClick={() => isActive && setSheet({ ...sheet, view: 'month', month: monthKey })}>
              <div className="month-name">{name}</div>
              <div className="month-sparkline">
                {weeks.map((w, j) => (<div key={j} className={`spark-bar ${w === 0 ? 'empty' : ''}`} style={{ height: `${w === 0 ? 15 : Math.max(20, (w / maxWeek) * 100)}%` }} />))}
              </div>
              <div className="month-count">{isActive ? `${monthReviewed + monthAdded} ${t("words")}` : '—'}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
  const renderMonthView = () => {
    const [y, m] = sheet.month.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const firstDay = new Date(y, m - 1, 1).getDay();
    const dayHeaders = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    return (
      <div>
        <button className="back-btn" onClick={() => setSheet({ ...sheet, view: 'annual' })}>← {t("back")}</button>
        <h3 style={{ fontSize: 20, fontWeight: 900, marginBottom: 12 }}>{monthNames[m - 1]} {y}</h3>
        <div className="calendar-grid">
          {dayHeaders.map((h, i) => <div key={i} className="calendar-day-header">{h}</div>)}
          {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`} className="calendar-day empty" />)}
          {Array.from({ length: daysInMonth }).map((_, i) => {
            const dayNum = i + 1;
            const dayKey = `${sheet.month}-${String(dayNum).padStart(2, '0')}`;
            const dayData = dailyActivity[dayKey];
            const hasActivity = dayData && (dayData.reviewed > 0 || dayData.added > 0);
            return (<div key={dayNum} className={`calendar-day ${hasActivity ? 'has-activity' : 'empty'}`} onClick={() => hasActivity && setSelectedDayData({ key: dayKey, dayNum, data: dayData })}>{dayNum}</div>);
          })}
        </div>
        {selectedDayData && selectedDayData.key.startsWith(sheet.month) && (
          <div className="day-detail-popover">
            <div className="popover-header">
              <div className="popover-title">{monthNames[m - 1]} {selectedDayData.dayNum}, {y}</div>
              <button className="sheet-close" onClick={() => setSelectedDayData(null)} aria-label="Close"><CloseIcon /></button>
            </div>
            <div className="popover-stat"><span className="popover-stat-label"><BookIcon size={14} color="#8B5CF6" /> {t("reviewedWords")}</span><span className="popover-stat-value">{selectedDayData.data.reviewed || 0}</span></div>
            <div className="popover-stat"><span className="popover-stat-label"><PlusIcon size={14} /> {t("wordsAdded")}</span><span className="popover-stat-value">{selectedDayData.data.added || 0}</span></div>
            <div className="popover-stat"><span className="popover-stat-label"><CheckIcon size={14} color="#10B981" /> {t("correctAnswers")}</span><span className="popover-stat-value">{selectedDayData.data.correct || 0}</span></div>
            <div className="popover-stat"><span className="popover-stat-label"><CrossIcon size={14} color="#EF4444" /> {t("wrong")}</span><span className="popover-stat-value">{selectedDayData.data.wrong || 0}</span></div>
            <div className="popover-stat"><span className="popover-stat-label"><ClockIcon size={14} /> {t("time")}</span><span className="popover-stat-value">{usage.fmt(usage.daily?.[selectedDayData.key] || 0)}</span></div>
          </div>
        )}
      </div>
    );
  };
  const hasActivity = (stats.wordsReviewed || 0) > 0 || (stats.wordsAdded || 0) > 0 || (stats.gamesPlayed || 0) > 0 || weekTimeTotal > 0;
  return (
    <div className="activity-view">
      <div className="stats-header-row"><h2><StatsIcon active={true} /> {t("stats")}</h2></div>
      {!hasActivity ? (
        <div className="stats-empty-state">
          <div className="stats-empty-icon"><StatsIcon active={false} /></div>
          <div className="stats-empty-title">{t("noActivity")}</div>
          <div className="stats-empty-desc">{t("noActivityDesc")}</div>
        </div>
      ) : (
        <>
          <div className="stats-week-strip">
            <div className="week-summary">
              <span className="week-summary-item"><BooksIcon size={16} /> {weekReviewedTotal} {t("reviewedToday")}</span>
              <span className="week-summary-item"><PlusIcon size={16} /> {weekAddedTotal} {t("wordsAdded")}</span>
              <span className="week-summary-item"><ClockIcon size={16} /> {usage.fmt(weekTimeTotal)}</span>
            </div>
            <div className="week-days-compact">
              {weekDays.map((d, i) => (
                <div key={i} className="day-num-item" title={`${d.reviewed} reviewed, ${d.added} added`}>
                  <div className="day-num-label">{d.label}</div>
                  <div className={`day-num-value intensity-${getIntensity(d.reviewed + d.added)}`}>{d.reviewed > 0 ? d.reviewed : d.added > 0 ? `+${d.added}` : '—'}</div>
                </div>
              ))}
            </div>
            <button className="btn-annual-details" onClick={() => setSheet({ open: true, view: 'annual', month: null })}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              {t("annualDetails")}
            </button>
          </div>
          <div className="stats-totals-grid">
            <div className="total-card"><div className="total-icon"><BooksIcon /></div><div className="total-value">{stats.wordsReviewed || 0}</div><div className="total-label">{t("reviewedWords")}</div></div>
            <div className="total-card"><div className="total-icon"><TargetIcon /></div><div className="total-value">{accuracy}%</div><div className="total-label">{t("accuracy")}</div></div>
            <div className="total-card"><div className="total-icon"><ClockIcon /></div><div className="total-value">{usage.fmt(usage.total)}</div><div className="total-label">{t("totalTime")}</div></div>

const TRANSLATION_LANG_CODES = { ar: "ar", en: "en", fr: "fr", es: "es", de: "de", pt: "pt", ja: "ja" };
function parseGoogleTranslation(data) {
  if (!Array.isArray(data) || !Array.isArray(data[0])) return "";
  return data[0].map(part => Array.isArray(part) ? (part[0] || "") : "").join("").trim();
}
async function translateWithGoogle(text, source, target, signal) {
  const sl = TRANSLATION_LANG_CODES[source] || source;
  const tl = TRANSLATION_LANG_CODES[target] || target;
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}&dt=t&q=${encodeURIComponent(text.trim())}`;
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error("Google translation request failed");
  const translated = parseGoogleTranslation(await res.json());
  if (!translated) throw new Error("Google returned no translation");
  return translated;
}
async function translateWithMyMemory(text, source, target, signal) {
  const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.trim())}&langpair=${encodeURIComponent(source)}|${encodeURIComponent(target)}`, { signal });
  if (!res.ok) throw new Error("MyMemory translation request failed");
  const data = await res.json();
  const translated = data?.responseData?.translatedText?.trim();
  if (!translated || translated.toLowerCase().includes("mymemory warning")) throw new Error("MyMemory returned no translation");
  return translated;
}
async function translateAccurately(text, source, target, signal) {
  try {
    return await translateWithGoogle(text, source, target, signal);
  } catch (googleError) {
    if (googleError?.name === "AbortError") throw googleError;
    return await translateWithMyMemory(text, source, target, signal);
  }
}

function SetEditor({ set, onBack, onUpdate, onDeleteWord, onWordAdded }) {
  const { t } = useI18n();
  const toast = useToast();
  const [name, setName] = useState(set.name);
  const [lang1, setLang1] = useState(set.lang1);
  const [lang2, setLang2] = useState(set.lang2);
  const [newWord, setNewWord] = useState({ word: "", translation: "" });
  const [isTranslating, setIsTranslating] = useState(false);
  const userEditedRef = useRef(false);
  const translateTimerRef = useRef(null);
  const abortRef = useRef(null);
  const handleVoiceChange = useCallback((text) => { setNewWord(prev => ({ ...prev, word: text })); }, []);
  const handleVoiceError = useCallback((reason) => { toast(reason === "permission" ? t("voicePermission") : t("voiceUnsupported"), "error"); }, [toast, t]);
  const { listening, supported, toggleListening } = useVoiceInput({ language: lang1, value: newWord.word, onChange: handleVoiceChange, onError: handleVoiceError });
  useEffect(() => { setName(set.name); setLang1(set.lang1); setLang2(set.lang2); }, [set.id]);
  const performTranslation = useCallback(async (text) => {
    if (!text.trim()) { setNewWord(prev => ({ ...prev, translation: '' })); return; }
    setIsTranslating(true);
    if (abortRef.current) abortRef.current.abort();
    const controller = new AbortController();
    abortRef.current = controller;
    try {
      const translated = await translateAccurately(text, lang1, lang2, controller.signal);
      if (!userEditedRef.current) setNewWord(prev => ({ ...prev, translation: translated }));
    } catch (err) { if (err.name === 'AbortError') return; } finally { setIsTranslating(false); }
  }, [lang1, lang2]);
  useEffect(() => {
    if (newWord.word.trim().length < 2) { setNewWord(prev => ({ ...prev, translation: '' })); return; }
    userEditedRef.current = false;
    clearTimeout(translateTimerRef.current);
    translateTimerRef.current = setTimeout(() => performTranslation(newWord.word), 300);
    return () => clearTimeout(translateTimerRef.current);
  }, [newWord.word, performTranslation]);
  useEffect(() => {
    if (newWord.word.trim().length >= 2) {
      userEditedRef.current = false;
      clearTimeout(translateTimerRef.current);
      translateTimerRef.current = setTimeout(() => performTranslation(newWord.word), 300);
    }
  }, [lang1, lang2]);
  const saveSetInfo = () => { onUpdate({ ...set, name, lang1, lang2 }); toast(t("savedMsg"), "success"); };
  const addWord = () => {
    if (!newWord.word.trim() || !newWord.translation.trim()) { toast("Fill both fields", "error"); return; }
    const word = { id: "w" + uid(), word: newWord.word.trim(), translation: newWord.translation.trim() };
    const updatedSet = { ...set, words: [...set.words, word] };
    onUpdate(updatedSet);
    if (onWordAdded) onWordAdded();
    setNewWord({ word: "", translation: "" });
    toast(t("savedMsg"), "success");
  };
  const l1 = getLang(lang1);
  const l2 = getLang(lang2);
  return (
    <div>
      <div className="page-header">
        <button type="button" className="btn btn-secondary" onClick={onBack}>← {t("back")}</button>
        <h2><EditIcon size={20} /> {t("editor")}</h2>
      </div>
      <div className="editor-box glass">
        <div className="field"><label>{t("setName")}</label><input value={name} onChange={e => setName(e.target.value)} /></div>
        <div className="grid-2">
          <div className="field"><label>{t("firstLang")}</label><select value={lang1} onChange={e => setLang1(e.target.value)}>{LANGS.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}</select></div>
          <div className="field"><label>{t("secondLang")}</label><select value={lang2} onChange={e => setLang2(e.target.value)}>{LANGS.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}</select></div>
        </div>
        <button type="button" className="btn btn-primary" onClick={saveSetInfo}><CheckIcon size={16} color="white" /> {t("save")}</button>
      </div>
      <div className="editor-box glass">
        <h3 style={{ marginBottom: 14, fontSize: 17, fontWeight: 800 }}><PlusIcon size={16} /> {t("addWord")}</h3>
        <div className="field">
          <label>{t("word")} ({l1.name})</label>
          <div className="voice-input-wrap">
            <input value={newWord.word} onChange={e => setNewWord({ ...newWord, word: e.target.value })} placeholder={`${t("word")} (${l1.name})`} />
            <button type="button" className={`voice-input-btn ${listening ? "listening" : ""}`} onClick={toggleListening} disabled={!supported} aria-label={listening ? t("voiceListening") : t("voiceInput")} aria-pressed={listening} title={listening ? t("voiceListening") : t("voiceInput")}><VoiceIcon size={22} /></button>
          </div>
          <div className={`voice-input-hint ${listening ? "listening" : ""}`}><VoiceIcon size={14} /> {listening ? t("voiceListening") : t("voiceInput")}</div>
          {isTranslating && <div className="muted" style={{ marginTop: 8 }}>⏳ {t("translating")}</div>}
        </div>
        <div className="field">
          <label>{t("translation")} ({l2.name})</label>
          <input value={newWord.translation} onChange={e => { userEditedRef.current = true; setNewWord({ ...newWord, translation: e.target.value }); }} placeholder={`${t("translation")} (${l2.name})`} />
        </div>
        <button type="button" className="btn btn-success btn-block" onClick={addWord} disabled={!newWord.word.trim() || !newWord.translation.trim()}><PlusIcon size={16} /> {t("add")}</button>
      </div>
      <div className="editor-box glass">
        <h3 style={{ marginBottom: 14, fontSize: 17, fontWeight: 800 }}><BookIcon size={16} color="#8B5CF6" /> {t("words")} ({set.words.length})</h3>
        {set.words.length === 0 && (<div className="empty-state"><div className="empty-icon"><BookIcon size={48} color="#8B5CF6" /></div><div className="empty-text">{t("noWords")}</div></div>)}
        {set.words.map(w => (
          <div key={w.id} className="word-row">
            <div className="word-row-main">
              <div className="word-row-text">{w.word}</div>
              <div className="word-row-translation">→ {w.translation}</div>
            </div>
            <div className="flex-row">
              <button type="button" className="icon-btn danger" onClick={() => { if (confirm(t("confirmDeleteWord"))) { onDeleteWord(set.id, w.id); toast(t("deleted"), "info"); } }} aria-label="Delete"><TrashIcon /></button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AppContent() {

  const [gameType, setGameType] = useState("flashcards");
  const [gameKey, setGameKey] = useState(0);
  const [retryWrong, setRetryWrong] = useState(false);
  const [gameResults, setGameResults] = useState(null);
  const [modal, setModal] = useState(null);
  const [newSet, setNewSet] = useState({ name: "", lang1: "fr", lang2: "ar" });
  const [essentialLangs, setEssentialLangs] = useState({ lang1: "fr", lang2: "ar" });
  const [loginData, setLoginData] = useState({ name: "", email: "" });
  const [settingsTab, setSettingsTab] = useState("general");
  useEffect(() => {
    if (!currentSetId && sets.length) setCurrentSetId(sets[0].id);
    if (currentSetId && !sets.find(s => s.id === currentSetId)) setCurrentSetId(sets[0]?.id || null);
  }, [sets, currentSetId]);
  const currentSet = sets.find(s => s.id === currentSetId) || null;
  const savedWords = sets.flatMap(s => s.words.filter(w => savedIds.includes(w.id)).map(w => ({ ...w, lang1: s.lang1, lang2: s.lang2 })));
  const savedSet = savedWords.length ? { id: "saved", name: t("sanctuary"), lang1: savedWords[0].lang1, lang2: savedWords[0].lang2, words: savedWords } : null;
  const totalWords = sets.reduce((acc, s) => acc + s.words.length, 0);
  const baseSet = gameType === "saved" ? savedSet : currentSet;
  const wrongIds = gameResults ? [...new Set(gameResults.filter(r => !r.correct).map(r => r.id))] : [];
  const gameSet = retryWrong && gameResults && baseSet ? { ...baseSet, words: baseSet.words.filter(w => wrongIds.includes(w.id)) } : baseSet;
  const updateSet = (updated) => setSets(prev => prev.map(s => (s.id === updated.id ? updated : s)));
  const deleteSet = (id) => { setSets(prev => prev.filter(s => s.id !== id)); toast(t("deleted"), "info"); };
  const deleteWord = (setId, wordId) => setSets(prev => prev.map(s => s.id !== setId ? s : { ...s, words: s.words.filter(w => w.id !== wordId) }));
  const toggleSaved = (wordId) => setSavedIds(prev => prev.includes(wordId) ? prev.filter(id => id !== wordId) : [...prev, wordId]);
  const createSet = () => {
    if (!newSet.name.trim()) { toast(t("setName"), "error"); return; }
    const set = { id: "set" + uid(), name: newSet.name.trim(), lang1: newSet.lang1, lang2: newSet.lang2, words: [] };
    setSets(prev => [...prev, set]);
    setCurrentSetId(set.id);
    setModal(null);
    setNewSet({ name: "", lang1: "fr", lang2: "ar" });
    toast(t("created"), "success");
  };
  const openEssentialFolder = () => {
    const lang1 = essentialLangs.lang1;
    const lang2 = essentialLangs.lang2;
    if (lang1 === lang2) { toast(t("sameLangError"), "error"); return; }
    const id = "essential_" + lang1 + "_" + lang2;
    const existing = sets.find(s => s.id === id);
    if (existing) {
      setCurrentSetId(id);
    } else {
      const setName = t("essentialFolder") + " · " + getLang(lang1).name + " → " + getLang(lang2).name;
      const set = buildEssentialSet(lang1, lang2, setName);
      setSets(prev => [...prev, set]);
      setCurrentSetId(id);
    }
    setModal(null);
    setMainTab("games");
    toast(t("folderReady"), "success");
  };
  const startGame = (type) => {
    if (type === "saved") {
      if (!savedWords.length) { toast(t("noSaved"), "error"); return; }
      setGameType("saved"); setRetryWrong(false); setGameKey(Date.now()); setView("game");
      return;
    }
    if (type === "dictee") {
      setGameType("dictee"); setRetryWrong(false); setGameKey(Date.now()); setView("game");
      return;
    }
    if (!currentSet) { toast(t("needSelectSet"), "error"); return; }
    if (!currentSet.words.length) { toast(t("noWords"), "error"); return; }
    setGameType(type); setRetryWrong(false); setGameKey(Date.now()); setView("game");
  };
  const finishGame = (results) => {
    const total = results.length;
    const correct = results.filter(r => r.correct).length;
    const pct = total ? Math.round((correct / total) * 100) : 0;
    usage.updateBestScore(pct);
    setGameResults(results);
    setView("results");
  };
  const handleAvatarUpload = (file) => {
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast("Max 2MB", "error"); return; }

      const nd = e.target.result;
      if (user) setUser({ ...user, avatar: nd });
      else setUser({ name: "User", email: "", avatar: nd });
      toast(t("savedMsg"), "success");
    };
    reader.onerror = () => toast(t("errorOccurred"), "error");
    reader.readAsDataURL(file);
  };
  const handleExport = () => {
    try {
      const data = { version: "10.0", sets, user, savedIds, voiceSettings, stats, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });

      const a = document.createElement("a");
      a.href = url;
      a.download = `vocaflow-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast(t("dataExported"), "success");
    } catch { toast(t("errorOccurred"), "error"); }
  };
  const handleImport = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.sets) setSets(data.sets);
        if (data.user) setUser(data.user);
        if (data.savedIds) setSavedIds(data.savedIds);
        if (data.voiceSettings) setVoiceSettings(data.voiceSettings);
        if (data.stats) { try { localStorage.setItem('vocaflow_real_stats', JSON.stringify(data.stats)); } catch {} }
        toast(t("dataImported"), "success");
        setModal(null);
      } catch { toast(t("invalidFile"), "error"); }
    };
    reader.onerror = () => toast(t("errorOccurred"), "error");
    reader.readAsText(file);

                )}
                <button type="button" className="btn btn-secondary btn-block" onClick={() => setModal("settings")} style={{ marginTop: 10 }}>⚙️ {t("settings")}</button>
              </div>
            </div>
          )}
        </div>
      )}
      {view === "editor" && currentSet && (
        <SetEditor set={currentSet} onBack={() => setView("home")} onUpdate={updateSet} onDeleteWord={deleteWord} onWordAdded={trackWordAdded} />
      )}
      {view === "game" && (gameSet || gameType === "dictee") && (
        <div>
          {(gameType === "flashcards" || gameType === "saved") && (
            <FlashcardsGame key={gameKey} set={gameSet} savedIds={savedIds} onToggleSaved={toggleSaved} onFinish={finishGame} onExit={() => setView("home")} voiceSettings={voiceSettings} onReview={trackReview} onGameComplete={trackGame} />
          )}
          {gameType === "mcq" && (
            <MCQGame key={gameKey} set={gameSet} savedIds={savedIds} onToggleSaved={toggleSaved} onFinish={finishGame} onExit={() => setView("home")} voiceSettings={voiceSettings} onReview={trackReview} onGameComplete={trackGame} />
          )}
          {gameType === "spelling" && (
            <SpellingGame key={gameKey} set={gameSet} savedIds={savedIds} onToggleSaved={toggleSaved} onFinish={finishGame} onExit={() => setView("home")} voiceSettings={voiceSettings} onReview={trackReview} onGameComplete={trackGame} />
          )}
          {gameType === "matching" && (
            <MatchingGame key={gameKey} set={gameSet} savedIds={savedIds} onToggleSaved={toggleSaved} onFinish={finishGame} onExit={() => setView("home")} onReview={trackReview} onGameComplete={trackGame} />
          )}
          {gameType === "dictee" && (
            <DicteeGame key={gameKey} onExit={() => setView("home")} onGameComplete={trackGame} />
          )}
        </div>
      )}
      {view === "results" && gameResults && (
        <Results results={gameResults} onRetry={() => { setRetryWrong(false); setGameKey(Date.now()); setView("game"); }} onRetryWrong={() => { setRetryWrong(true); setGameKey(Date.now()); setView("game"); }} onHome={() => setView("home")} />
      )}
      {modal === "essential" && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3 style={{ display: "flex", alignItems: "center", gap: 10 }}><EssentialFolderIcon size={28} /> {t("essentialFolder")}</h3>
            <p className="muted" style={{ marginBottom: 16, lineHeight: 1.6 }}>{t("essentialFolderDesc")}</p>
            <div className="grid-2">
              <div className="field">
                <label>{t("firstLang")}</label>
                <select value={essentialLangs.lang1} onChange={e => setEssentialLangs({ ...essentialLangs, lang1: e.target.value })}>
                  {langs.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}
                </select>
              </div>
              <div className="field">
                <label>{t("secondLang")}</label>
                <select value={essentialLangs.lang2} onChange={e => setEssentialLangs({ ...essentialLangs, lang2: e.target.value })}>
                  {langs.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}
                </select>
              </div>
            </div>
            <div className="essential-preview">
              {ESSENTIAL_WORDS.slice(0, 8).map((w, i) => (
                <div key={i} className="essential-preview-row">
                  <span>{w[essentialLangs.lang1] || w.en}</span>
                  <span className="muted">→</span>
                  <span>{w[essentialLangs.lang2] || w.en}</span>
                </div>
              ))}
              <div className="essential-more">+ {ESSENTIAL_WORDS.length - 8} {t("words")}</div>
            </div>
            <div className="modal-actions">
              <button type="button" className="btn btn-secondary" onClick={() => setModal(null)}>{t("cancel")}</button>
              <button type="button" className="btn btn-primary" onClick={openEssentialFolder}>📂 {t("openFolder")}</button>
            </div>
          </div>
        </div>
      )}
      {modal === "createSet" && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3><PlusIcon size={20} /> {t("createSet")}</h3>
            <div className="field"><label>{t("setName")}</label><input value={newSet.name} onChange={e => setNewSet({ ...newSet, name: e.target.value })} autoFocus /></div>
            <div className="grid-2">
              <div className="field"><label>{t("firstLang")}</label><select value={newSet.lang1} onChange={e => setNewSet({ ...newSet, lang1: e.target.value })}>{langs.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}</select></div>
              <div className="field"><label>{t("secondLang")}</label><select value={newSet.lang2} onChange={e => setNewSet({ ...newSet, lang2: e.target.value })}>{langs.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}</select></div>
            </div>
            <div className="modal-actions">
              <button type="button" className="btn btn-secondary" onClick={() => setModal(null)}>{t("cancel")}</button>
              <button type="button" className="btn btn-primary" onClick={createSet}>{t("save")}</button>
            </div>
          </div>
        </div>
      )}
      {modal === "settings" && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>{t("settings")}</h3>
            <div className="tabs">
              <div className={`tab ${settingsTab === "general" ? "active" : ""}`} onClick={() => setSettingsTab("general")}>🌍 {t("language")}</div>
              <div className={`tab ${settingsTab === "voice" ? "active" : ""}`} onClick={() => setSettingsTab("voice")}><SpeakerIcon size={14} /> {t("voiceSettings")}</div>
              <div className={`tab ${settingsTab === "data" ? "active" : ""}`} onClick={() => setSettingsTab("data")}><BookIcon size={14} color="#8B5CF6" /> Backup</div>
            </div>
            {settingsTab === "general" && (
              <div><div className="field"><label>🌍 {t("language")}</label><select value={locale} onChange={e => setLocale(e.target.value)}>{langs.map(l => (<option key={l.code} value={l.code}>{l.flag} {l.name}</option>))}</select></div></div>
            )}
            {settingsTab === "voice" && (
              <div>
                <div className="field">
                  <label>⚡ {t("speechRate")}: {voiceSettings.rate.toFixed(2)}</label>
                  <div className="slider-wrap"><span>🐢</span><input type="range" min="0.5" max="1.5" step="0.05" value={voiceSettings.rate} onChange={e => setVoiceSettings({ ...voiceSettings, rate: parseFloat(e.target.value) })} /><span>🐇</span><span className="slider-value">{voiceSettings.rate.toFixed(2)}</span></div>
                </div>
                <div className="field">
                  <label>🎵 {t("pitch")}: {voiceSettings.pitch.toFixed(2)}</label>
                  <div className="slider-wrap"><span>⬇</span><input type="range" min="0.5" max="1.5" step="0.05" value={voiceSettings.pitch} onChange={e => setVoiceSettings({ ...voiceSettings, pitch: parseFloat(e.target.value) })} /><span>⬆</span><span className="slider-value">{voiceSettings.pitch.toFixed(2)}</span></div>
                </div>
              </div>
            )}
            {settingsTab === "data" && (
              <div>
                <div className="field"><label><BookIcon size={14} color="#8B5CF6" /> {t("exportData")}</label><button type="button" className="btn btn-primary btn-block" onClick={handleExport}>📥 Download Backup</button></div>
                <div className="field"><label><BookIcon size={14} color="#8B5CF6" /> {t("importData")}</label><div className="file-upload-wrap"><FolderIcon size={18} /> Choose backup file<input type="file" accept=".json" onChange={e => handleImport(e.target.files[0])} /></div></div>
                <div className="field" style={{ marginTop: 20 }}><label>⚠️ {t("resetAll")}</label><button type="button" className="btn btn-danger btn-block" onClick={handleReset}>🗑️ {t("resetAll")}</button></div>
              </div>
            )}
            <div className="modal-actions"><button type="button" className="btn btn-primary btn-block" onClick={() => setModal(null)}>{t("close")}</button></div>
          </div>
        </div>
      )}
      {modal === "login" && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>🔐 {t("login")}</h3>
            <div className="field"><label>{t("name")}</label><input value={loginData.name} onChange={e => setLoginData({ ...loginData, name: e.target.value })} autoFocus /></div>
            <div className="field"><label>{t("email")}</label><input value={loginData.email} onChange={e => setLoginData({ ...loginData, email: e.target.value })} type="email" /></div>
            <div className="modal-actions">
              <button type="button" className="btn btn-secondary" onClick={() => setModal(null)}>{t("cancel")}</button>
              <button type="button" className="btn btn-primary" onClick={() => { if (!loginData.name.trim()) return; setUser({ name: loginData.name.trim(), email: loginData.email.trim() }); setModal(null); toast(t("savedMsg"), "success"); }}>{t("login")}</button>
            </div>
          </div>
        </div>
      )}
      {!hideNav && <BottomNav activeTab={mainTab} onTabChange={setMainTab} t={t} />}
    </div>
  );
}

function Root() {
  return (
    <ErrorBoundary>
      <I18nProvider>
        <ThemeProvider>
          <ToastProvider>
            <AppContent />
          </ToastProvider>
        </ThemeProvider>
      </I18nProvider>
    </ErrorBoundary>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
